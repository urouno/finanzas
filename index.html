      var p = padreCat(nombre), idx = []; a.cat_sub.forEach(function (x, k) { if (x.indexOf(p + '>') === 0) idx.push(k); });
      i = idx.indexOf(a.cat_sub.indexOf(p + '>' + nombre)); j = i + dir; if (i < 0 || j < 0 || j >= idx.length) return;
      var t = a.cat_sub[idx[i]]; a.cat_sub[idx[i]] = a.cat_sub[idx[j]]; a.cat_sub[idx[j]] = t;
    } else {
      l = a[key]; i = l.indexOf(nombre); j = i + dir; if (i < 0 || j < 0 || j >= l.length) return;
      var t2 = l[i]; l[i] = l[j]; l[j] = t2;
    }
    guardarAjustes(a);
  }
  // Organización v2 (una sola vez): aclara nombres ambiguos y agrega lo más común, sin perder nada.
  //   Deudas -> Comisiones e intereses (los pagos de deuda son transferencias, no gastos)
  //   Vivienda -> Vivienda y servicios · nuevas: Compras, Educación · Alimentos: Supermercado y Restaurantes y café
  function migrarCategorias() {

    var p = M.padreCat(cat); return p && p !== cat ? icoCat(p) : 'tag';  // una subcategoría sin ícono propio usa el de su categoría
  }
  var CAT_FIJA = { 'Sin categoría': 'var(--k8)', 'Compras a meses': 'var(--tinta)', 'Pago de préstamo': 'var(--prest)', 'Entregado a personas': 'var(--aviso)', 'Gasto no registrado': 'var(--k8)', 'Ajuste de saldo': 'var(--k8)' };
  function colCat(cat) {
    if (!cat) return 'var(--k8)';

    if (CAT_FIJA[cat]) return CAT_FIJA[cat];
    var i = todasCats().indexOf(cat);
    if (i < 0) { i = 0; String(cat).split('').forEach(function (c) { i = (i * 31 + c.charCodeAt(0)) % 9973; }); }

  }
  function badge(k, col, cl) { return '<span class="bdg' + (cl ? ' ' + cl : '') + '" style="--kc:' + col + '">' + ico(k) + '</span>'; }

  function badgeMov(m) {

  function badgeCta(c) {

  function filaMov(m, op) {
    op = op || {};
    var v = M.vista(m), dt = M.parse(m.fecha), o = M.cta(m.origen), d = M.cta(m.destino), monto = +m.monto || 0, cls = '', sig = '', sub, cat = m.categoria;

      sub = (d && String(m.concepto || '').indexOf(d.nombre) >= 0 ? 'desde ' + nom(o) : nom(o) + ' → ' + nom(d)) + (M.esPrestamo(d) && M.pctMov(m) < 100 ? (m.quienPaga === 'ella' ? ', ella paga al banco' : ', yo pago al banco') : '');
      if (cat === 'Pago de tarjeta' || cat === 'Pago de préstamo') cat = '';
    }
    var titulo = m.concepto || 'Sin concepto';
    if (v === 'no' && m.tipo === 'transferencia' && d && d.tipo === T.TC) { titulo = titulo.replace(/^Pendiente con intereses /, 'Pago '); sub = 'no pagado: sigue en la deuda de la tarjeta'; cat = ''; }
    var txt = monto === 0 && m.estado === 'planeado' ? 'por definir' : sig + din(monto);
    var fecha = op.sinFecha ? '' : '<small>' + dt.getDate() + ' ' + MES[dt.getMonth()] + '</small>';

    var et = etiquetas(m, v, op.urg);

      badgeMov(m) +

      (m.estado === 'planeado' && !M.esMens(m) && !op.sinOk ? '<button class="ok" data-a="confirmar" data-id="' + esc(m.id) + '" aria-label="Confirmar ' + esc(m.concepto) + '">' + ICO_OK + '</button>' : '') +

  }
  function tile(color, t, v) { return '<div class="tile"><span><i style="background:' + color + '"></i>' + t + '</span><b>' + v + '</b></div>'; }

  /* ---------- presupuestos: piezas que usan Inicio y la pantalla Presupuesto ---------- */
  var EST_TXT = { v: 'En orden', a: 'Cerca del límite', r: 'Rebasado' };
  var EST_COL = { v: 'var(--pos)', a: 'var(--aviso)', r: 'var(--neg)' };
  function nomCat(c) { return c === M.GEN ? 'Presupuesto general' : c; }
  // barra de presupuesto: tramo sólido = ya gastado, tramo rayado = planeado (aún no ocurre)
  function barraPres(conf, plan, tope, st) {
    var t = Math.max(tope, conf + plan, 0.01), a = Math.max(0, conf) / t * 100, b = Math.max(0, plan) / t * 100;

  }
  function metroPres(l, ym) {
    var st = l.est;
    return '<button class="cat" data-a="presCat" data-v="' + esc(l.cat) + '" data-ym="' + ym + '">' + badge(icoCat(l.cat), colCat(l.cat)) + '<div class="cat-c">' +
      '<div class="cat-t"><span>' + esc(l.cat) + '</span><em class="pill ' + st + '">' + (st === 'r' ? 'Excedido' : Math.round(l.pct) + ' %') + '</em></div>' +
      barraPres(l.conf, l.plan, l.tope, st) +
      '<div class="cat-s"><span>' + din0(l.usado) + ' de ' + din0(l.tope) + (l.plan ? ' · ' + din0(l.plan) + ' planeado' : '') + (l.unMes ? ' · solo este mes' : '') + '</span>' +
      '<b class="' + (st === 'r' ? 'neg' : st === 'a' ? 'avi' : 'pos') + '">' + (l.restante >= 0 ? 'Quedan ' + din0(l.restante) : 'Te pasas ' + din0(-l.restante)) + '</b></div>' +
      '</div></button>';
  }
  // tarjeta resumen: anillo con el % usado del presupuesto general (o de la suma de topes)
  function resumenPres(pb, conRitmo) {
    var col = EST_COL[pb.est], H = '<div class="pres-top">' + anillo(pb.pct, col, Math.round(pb.pct) + '%') +

      '<small class="' + (pb.restante < 0 ? 'neg' : '') + '">' + (pb.restante >= 0 ? 'Quedan ' + din0(pb.restante) : 'Te pasas por ' + din0(-pb.restante)) + '</small></div></div>';
    if (conRitmo && pb.ritmo.restan > 0 && pb.ritmo.pasados > 0 && pb.tope > 0) {

  }

  }

  /* ---------- Inicio ---------- */
  function vInicio() {
    var h = M.hoy(), ym = h.slice(0, 7), r = M.resumenMes(ym), p = M.posicion(null), q = M.posicion(M.finMes(h)), ini = S.ajustes.fecha_inicio, H = '';

    // ---- 1. Lo que queda para gastar (barrera: primero los fijos, lo que sobra es para variables) ----

        '</p><span class="et ' + est[0] + '">' + est[1] + '</span></div>';
    }
    H += '<section class="tarj hero2"><div class="cab"><span class="eti">Te queda para gastar en ' + mes + '</span><span class="et ' + (pas ? 'r' : 'v') + '">' + (pas ? 'Rebasado' : 'En presupuesto') + '</span></div>' +
      '<div class="gran' + (pas ? ' neg' : '') + '">' + dinG(d) + '</div>' +
      '<div class="barrera" role="img" aria-label="Fijos pagados ' + din(r.fijoConf) + ', fijos por pagar ' + din(r.fijoPend) + ', variables gastados ' + din(r.varConf) + ', variables planeados ' + din(r.varPend) + ', libre ' + din(d) + '">' +
      '<i class="f1" style="width:' + wf + '%"></i><i class="f2" style="width:' + wfp + '%"></i><i class="v1" style="width:' + wv + '%"></i><i class="v2" style="width:' + wvp + '%"></i><i class="d" style="width:' + wd + '%"></i></div>' +

      '<div class="tiles">' + tile('var(--pos)', 'Ingresos', din0(r.ingresos)) + tile('var(--tinta)', 'Fijos · ' + pctF.toFixed(0) + ' %', din0(r.fijoTotal)) + tile('var(--aviso)', 'Variables', din0(r.varConf + r.varPend)) + '</div>' +
      (dif < 0 ? '<div class="banda r" style="margin:12px 0 0">Los fijos superan tus ingresos por <b class="num">' + din(-dif) + '</b>.</div>' : '') +
      ritmo +
      '<details class="desg"><summary>Ver desglose</summary><div class="dz">' +
      dato('Ingresos recibidos', din(r.ingConf), 'pos') + dato('Ingresos por recibir', din(r.ingPlan)) +
      dato('Fijos ya pagados', din(r.fijoConf)) + dato('Fijos por pagar', din(r.fijoPend), r.fijoPend ? 'avi' : '') +
      (r.mens ? dato('— incluye mensualidades a meses', din(r.mens), 'gr') : '') + (r.prestPag ? dato('— incluye préstamos pagados', din(r.prestPag), 'gr') : '') +
      dato('Variables ya gastados', din(r.varConf)) + dato('Variables planeados', din(r.varPend)) +
      (r.perPag ? dato('— incluye entregado a personas', din(r.perPag), 'gr') : '') +
      (r.abonos ? dato('Devoluciones y abonos', din(-r.abonos), 'pos') : '') +
      dato('Presupuesto para variables', din(r.presupuestoVar), r.presupuestoVar < 0 ? 'neg' : 'pos') +

    H += tarjPlanInicio();

    // ---- 2. Requiere atención: pagos atrasados, presupuestos al límite y tarjetas muy usadas ----

          '<div class="md-b' + (a.t === 'sin' ? ' r' : '') + '"><i style="width:' + Math.min(100, a.uso) + '%"></i><u style="left:' + um + '%"></u></div></div></div></button>';

    }

    // ---- 3. Presupuesto del mes (resumen; el detalle está en Plan › Presupuesto) ----

    H += '<section class="tarj"><div class="cab"><h2>Presupuesto de ' + mes + '</h2>' + (pb.hay ? etiquetaPres(pb) : '') + '</div>';

    else {

      H += '<div class="btns"><button class="btn sec2" data-a="ir" data-v="pres">Ver presupuesto' + (pb.lineas.length > 3 ? ' (' + pb.lineas.length + ' categorías)' : '') + '</button></div>';
    }
    H += '</section>';

    // ---- 4. Próximos pagos ----
    var prox = M.listaPagos({ desde: h, hasta: M.addDays(h, 60), estados: { pend: 1, porconf: 1 } }).filter(function (x) { return x.clase !== 'ingreso' && !x.m.incompleto; }).slice(0, 4);

    var fs = [['Efectivo y débito', p.dinero, q.dinero, 'var(--pos)'], ['Por cobrar', p.cobrar, q.cobrar, 'var(--aviso)'], ['Tarjetas propias', -p.tarjetas, -q.tarjetas, 'var(--tc)'], ['Préstamos, tu parte', -p.prestamos, -q.prestamos, 'var(--prest)']];
    var ms = Math.max.apply(null, fs.map(function (f) { return Math.max(Math.abs(f[1]), Math.abs(f[2])); }).concat([1]));
