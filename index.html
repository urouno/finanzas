  App de finanzas personales. Un solo archivo: estilos, pantallas y cálculos.
  No contiene datos ni claves: todo vive en tu hoja de Google y viaja con tu clave.

<style>
:root{
  --bg:#F2F4F1; --sup:#FFFFFF; --sup2:#E8ECE7; --tinta:#17211D; --gris:#5E6B64; --linea:#DCE2DC;
  --marca:#0E6B50; --cabeza:#0E6B50; --pos:#0E6B50; --neg:#C2362B; --aviso:#9A5B00; --tc:#2A57C4; --comp:#7A3E9D; --prest:#8C5A26;
  --pos-s:#DDEFE7; --neg-s:#F9E1DE; --aviso-s:#F6E8CC; --tc-s:#E1E8FA; --comp-s:#EFE3F6; --gris-s:#E8ECE7;
  --num:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --txt:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0F1513; --sup:#18201D; --sup2:#222C28; --tinta:#E8EEE9; --gris:#98A69E; --linea:#2B3732;
  --marca:#47C39A; --cabeza:#0B4F3C; --pos:#47C39A; --neg:#FF8375; --aviso:#F0B14D; --tc:#8CACFF; --comp:#CFA2EC; --prest:#DDAA72;
  --pos-s:#17382E; --neg-s:#45211D; --aviso-s:#3D3018; --tc-s:#1D2A4A; --comp-s:#35223F; --gris-s:#222C28; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0F1513; --sup:#18201D; --sup2:#222C28; --tinta:#E8EEE9; --gris:#98A69E; --linea:#2B3732;
  --marca:#47C39A; --cabeza:#0B4F3C; --pos:#47C39A; --neg:#FF8375; --aviso:#F0B14D; --tc:#8CACFF; --comp:#CFA2EC; --prest:#DDAA72;
  --pos-s:#17382E; --neg-s:#45211D; --aviso-s:#3D3018; --tc-s:#1D2A4A; --comp-s:#35223F; --gris-s:#222C28; color-scheme:dark; }

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{height:100%; -webkit-text-size-adjust:100%}
body{margin:0; min-height:100%; background:var(--bg); color:var(--tinta); font:15px/1.4 var(--txt); overscroll-behavior-y:none}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer; border:0; background:none; padding:0; text-align:inherit}
:focus-visible{outline:2px solid var(--tc); outline-offset:2px}
[hidden]{display:none!important}
.num{font-family:var(--num); font-variant-numeric:tabular-nums; letter-spacing:-.01em}
.pos{color:var(--pos)} .neg{color:var(--neg)} .avi{color:var(--aviso)} .gr{color:var(--gris)}

/* estructura */
#app{max-width:560px; margin:0 auto; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column}
#top{position:sticky; top:0; z-index:5; background:var(--cabeza); color:#fff; padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px; display:flex; align-items:center; justify-content:space-between; gap:12px}
#top h1{margin:0; font-size:20px; font-weight:700; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0}
#sync{flex:none; white-space:nowrap; display:flex; align-items:center; gap:6px; color:#fff; font-size:13px; padding:6px 10px; border-radius:99px; background:rgba(255,255,255,.14)}
#sync i{width:8px; height:8px; border-radius:50%; background:#8FE3C2}
#sync.pend i{background:#FFD27A} #sync.error i{background:#FF9C90} #sync.local i{background:#fff; opacity:.6}
#sync.sync i{animation:late 1s infinite alternate}
@keyframes late{to{opacity:.25}}
#vista{flex:1; padding:14px 14px calc(env(safe-area-inset-bottom,0px) + 96px)}

<script>
/* ===================== MOTOR: reglas y cálculos (sin pantalla) ===================== */
var M = (function () {
  'use strict';
  var T = { EF: 'efectivo', DB: 'debito', TC: 'tc', PF: 'prestamo_fijo', PV: 'prestamo_var', TS: 'tc_compartida', PE: 'persona' };
  var CAT_FAVOR = 'Préstamo a favor';
  var S = null, log = [], mapa = new Map(), mapC = new Map(), hoyFijo = null;

  var NUM = {
    cuentas: ['limite', 'saldoInicial', 'diaCorte', 'pctPropio', 'mensualidad', 'pagosTotales', 'saldoManual'],
    movs: ['monto', 'pctPropio', 'montoPropio', 'mesN', 'mesDe', 'interes', 'mensualidad', 'mesIni', 'montoCorte'],
    fijos: ['monto', 'mes']
  };
  var BOOL = {
    cuentas: ['archivada', 'revisar'],
    movs: ['aproximado', 'conInt', 'noAfecta', 'editado', 'incompleto'],
    fijos: ['aproximado', 'activa']
  };
  var AJUSTES_DEF = {
    cat_gasto: ['Alimentos', 'Transporte', 'Entretenimiento', 'Salud', 'Vivienda', 'Suscripciones', 'Deudas'],
    cat_ingreso: ['Sueldo', 'Comisión', 'Reembolso'],
    cat_transferencia: ['Pago de tarjeta', 'Pago de préstamo', CAT_FAVOR],
    cat_abono: ['Devolución', 'Cashback y puntos'],
    pct_compartido: 50, umbral_uso: 40, ajuste_finde: true, fecha_inicio: ''
  };

  /* ---------- utilidades ---------- */
  function r2(n) { return Math.round(((+n) || 0) * 100 + 1e-7 * Math.sign(+n || 0)) / 100; }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parse(s) { var p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function hoy() { return hoyFijo || iso(new Date()); }
  function dim(y, m) { return new Date(y, m + 1, 0).getDate(); }
  function mk(y, m, d) { var b = new Date(y, m, 1); return iso(new Date(b.getFullYear(), b.getMonth(), Math.min(d, dim(b.getFullYear(), b.getMonth())))); }
  function addDays(s, n) { var d = parse(s); d.setDate(d.getDate() + n); return iso(d); }
  function addMonths(s, n, dia) { var d = parse(s); return mk(d.getFullYear(), d.getMonth() + n, dia || d.getDate()); }
  function finMes(s) { var d = parse(s); return mk(d.getFullYear(), d.getMonth(), 31); }
  function iniMes(s) { return s.slice(0, 8) + '01'; }
  function vac(v) { return v === undefined || v === null || v === '' || v === false; }
  function eq(a, b) {
    if (vac(a) && vac(b)) return true;
    if (typeof a === 'number' || typeof b === 'number') return !vac(a) && !vac(b) && Math.abs(+a - +b) < 0.005;
    return a === b;
  }
  function uid(p) { return (p || 'm') + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  /* ---------- estado ---------- */
  function normFila(hoja, f) {
    var o = {};
    for (var k in f) { if (!vac(f[k])) o[k] = f[k]; }
    NUM[hoja].forEach(function (k) { if (k in o) { var n = +o[k]; if (isNaN(n)) delete o[k]; else o[k] = n; } });
    BOOL[hoja].forEach(function (k) { if (k in o) { var v = o[k]; o[k] = v === true || /^(si|sí|true|1|x)$/i.test(String(v)); if (!o[k]) delete o[k]; } });
    ['id', 'diaPago', 'dias', 'ultimos4', 'adicionales', 'fecha', 'corte', 'mesFecha', 'fechaLimite', 'fechaSaldoInicial', 'fechaTermino', 'desde', 'hasta'].forEach(function (k) { if (k in o) o[k] = String(o[k]); });
    return o;
  }
  function norm(d) {
    d = d || {};
    var a = {}, src = d.ajustes || {};
    for (var k in AJUSTES_DEF) a[k] = Array.isArray(AJUSTES_DEF[k]) ? AJUSTES_DEF[k].slice() : AJUSTES_DEF[k];
    for (var k2 in src) {
      if (Array.isArray(AJUSTES_DEF[k2])) a[k2] = (Array.isArray(src[k2]) ? src[k2] : [src[k2]]).map(String).filter(Boolean);
      else if (typeof AJUSTES_DEF[k2] === 'number') a[k2] = isNaN(+src[k2]) ? AJUSTES_DEF[k2] : +src[k2];
      else if (typeof AJUSTES_DEF[k2] === 'boolean') a[k2] = src[k2] === true || /^(si|sí|true|1)$/i.test(String(src[k2]));
      else a[k2] = src[k2];
    }
    if (a.cat_transferencia.indexOf(CAT_FAVOR) < 0) a.cat_transferencia.push(CAT_FAVOR);
    return {
      cuentas: (d.cuentas || []).filter(function (x) { return x && x.id; }).map(function (x) { return normFila('cuentas', x); }),
      movs: (d.movs || d.movimientos || []).filter(function (x) { return x && x.id; }).map(function (x) { return normFila('movs', x); }),
      fijos: (d.fijos || []).filter(function (x) { return x && x.id; }).map(function (x) { return normFila('fijos', x); }),
      ajustes: a
    };
  }
  function usar(st) {
    S = st; mapa = new Map(); mapC = new Map();
    S.movs.forEach(function (m) { mapa.set(m.id, m); });
    S.cuentas.forEach(function (c) { mapC.set(c.id, c); });
    return S;
  }
  function estado() { return S; }
  function tomarLog() { var l = log; log = []; return l; }
  function logOp(op, hoja, fila) { log.push({ op: op, hoja: hoja, id: fila.id, fila: op === 'upsert' ? JSON.parse(JSON.stringify(fila)) : undefined }); }
  function crea(hoja, o) { o = normFila(hoja, o); S[hoja].push(o); if (hoja === 'movs') mapa.set(o.id, o); if (hoja === 'cuentas') mapC.set(o.id, o); logOp('upsert', hoja, o); return o; }
  function parche(hoja, o, p) {
    var ch = false;
    for (var k in p) { if (!eq(o[k], p[k])) { if (vac(p[k])) delete o[k]; else o[k] = p[k]; ch = true; } }
    if (ch) logOp('upsert', hoja, o);
    return ch;
  }
  function borra(hoja, id) {
    var a = S[hoja], i = a.findIndex(function (x) { return x.id === id; });
    if (i < 0) return;
    a.splice(i, 1); if (hoja === 'movs') mapa.delete(id); if (hoja === 'cuentas') mapC.delete(id);
    logOp('borrar', hoja, { id: id });
  }
  function pone(hoja, o) {
    o = normFila(hoja, o);
    var a = S[hoja], i = a.findIndex(function (x) { return x.id === o.id; });
    if (i >= 0) a[i] = o; else a.push(o);
    if (hoja === 'movs') mapa.set(o.id, o); if (hoja === 'cuentas') mapC.set(o.id, o);
    logOp('upsert', hoja, o); return o;
  }
  function cta(id) { return id ? mapC.get(id) : undefined; }
  function mov(id) { return mapa.get(id); }
  function inicio() { return S.ajustes.fecha_inicio || '2000-01-01'; }

  /* ---------- clasificación ---------- */
  function esActivo(c) { return !!c && (c.tipo === T.EF || c.tipo === T.DB); }

  /* ---------- piezas de formulario ---------- */
  var CIERRA = '<button class="cierra" data-a="cerrar" aria-label="Cerrar">×</button>';

  /* ---------- formulario de movimiento ---------- */
  function borrNuevo(tipo, base) {
    var b = { nuevo: true, id: '', tipo: tipo || 'gasto', monto: '', concepto: '', fecha: M.hoy(), origen: '', destino: '', categoria: '', modalidad: 'contado', meses: '', mensualidad: '', pct: '', quienPaga: '', corte: null, estado: 'confirmado', notas: '', noAfecta: false };
    if (base && base.tipo === b.tipo) { b.origen = base.origen; b.destino = base.destino; }
    return ajustarBorr(b);
  }
  function borrDeMov(m) {
    var cm = M.esCompraMeses(m), mci = cm && m.conInt;
    return {
      nuevo: false, id: m.id, tipo: m.tipo, monto: mci ? r2(m.monto - (+m.interes || 0)) : m.monto, concepto: m.concepto || '', fecha: m.fecha, origen: m.origen || '', destino: m.destino || '', categoria: m.categoria || '',
      modalidad: cm ? (mci ? 'mci' : 'msi') : 'contado', meses: m.mesDe || '', mensualidad: m.mensualidad || '', pct: m.pctPropio || '', quienPaga: m.quienPaga || '', corte: m.corte || '', estado: m.estado, notas: m.notas || '', noAfecta: !!m.noAfecta,
      esMens: M.esMens(m), manual: (m.fuente || 'manual') === 'manual'
    };
  }
  function ajustarBorr(b) {
    if (b.esMens) return b;
    var deb = M.cuentaPago(), o = M.cta(b.origen), d = M.cta(b.destino);
    function en(c, tipos) { return c && tipos.indexOf(c.tipo) >= 0; }
    if (b.tipo === 'gasto') { if (!en(o, [T.EF, T.DB, T.TC, T.TS])) b.origen = deb; b.destino = ''; }
    else if (b.tipo === 'ingreso') { if (!en(d, [T.EF, T.DB])) b.destino = deb; b.origen = ''; }
    else if (b.tipo === 'abono') { if (!en(d, [T.TC])) b.destino = (ctas([T.TC])[0] || {}).id || ''; b.origen = ''; }
    else { if (!en(o, [T.EF, T.DB, T.PE])) b.origen = deb; if (b.destino === b.origen) b.destino = ''; }
    o = M.cta(b.origen); d = M.cta(b.destino);
    if (!(b.tipo === 'gasto' && M.esTarjeta(o))) b.modalidad = 'contado';
    if (b.tipo === 'gasto' && o && o.tipo === T.TS) { if (!b.pct) b.pct = M.pctCta(o) < 100 ? M.pctCta(o) : S.ajustes.pct_compartido; }
    else if (b.tipo === 'transferencia' && M.esPrestamo(d) && M.pctCta(d) < 100) { if (!b.pct) b.pct = M.pctCta(d); if (!b.quienPaga) b.quienPaga = d.quienPaga || 'yo'; }
    else { b.pct = ''; b.quienPaga = ''; }
    if (b.tipo === 'transferencia') {
      var auto = ['Pago de tarjeta', 'Pago de préstamo'];
      if (M.esTarjeta(d)) { if (!b.categoria || auto.indexOf(b.categoria) >= 0) b.categoria = auto[0]; }
      else if (M.esPrestamo(d)) { if (!b.categoria || auto.indexOf(b.categoria) >= 0) b.categoria = auto[1]; }
      else if (auto.indexOf(b.categoria) >= 0) b.categoria = '';
      if (b.nuevo) {
        var pend = M.esTarjeta(d) ? M.pagosPendientes(d.id) : [];
        if (!pend.length) b.corte = '';
        else if (b.corte === null || (b.corte && !pend.some(function (m) { return m.corte === b.corte; }))) b.corte = pend[0].corte;
      }
    } else if (b.nuevo) b.corte = null;
    var lista = S.ajustes['cat_' + b.tipo] || [];
    if (b.categoria && lista.indexOf(b.categoria) < 0 && b.nuevo) b.categoria = '';
    return b;
  }
  function calcMov(b) {
    var monto = num(b.monto), o = M.cta(b.origen), d = M.cta(b.destino), t = [];
    if (isNaN(monto)) monto = 0;
    if (b.tipo === 'gasto' && M.esTarjeta(o) && b.modalidad !== 'contado') {
      var n = parseInt(b.meses, 10) || 0, me = num(b.mensualidad);
      if (b.modalidad === 'msi' && n >= 2) t.push(n + ' mensualidades de <b>' + din(monto / n) + '</b>, una por corte. La deuda de la tarjeta sube ' + din(monto) + ' de una vez.');
      if (b.modalidad === 'mci' && n >= 2 && me > 0) t.push('Total a pagar <b>' + din(me * n) + '</b> en ' + n + ' mensualidades. Interés: <b>' + din(me * n - monto) + '</b>.');
      monto = b.modalidad === 'mci' && me > 0 ? me * n : monto;
    }
    if (b.tipo === 'gasto' && o && o.tipo === T.TS) { var p = num(b.pct) || 0; t.push('Tu parte: <b>' + din(monto * p / 100) + '</b> de ' + din(monto) + '. Se suma a tu próximo pago de esta tarjeta.'); }
    if (b.tipo === 'transferencia' && M.esPrestamo(d) && b.pct) {
      var pp = num(b.pct) || 100, mio = r2(monto * pp / 100);
      t.push(b.quienPaga === 'ella' ? 'Ella paga al banco: de tu débito sale solo tu parte, <b>' + din(mio) + '</b>.' : 'Tú pagas al banco: de tu débito salen <b>' + din(monto) + '</b>. Tu parte es ' + din(mio) + ' y quedan <b>' + din(monto - mio) + '</b> por cobrar.');
    }
    if (b.tipo === 'transferencia' && o && o.tipo === T.PE) t.push('Devolución: baja lo que te debe ' + nom(o) + '. No cuenta como ingreso.');
    if (b.tipo === 'transferencia' && d && d.tipo === T.PE) t.push(b.categoria === M.CAT_FAVOR ? 'Queda por cobrar a ' + nom(d) + '. No cuenta como gasto.' : 'Si te lo van a devolver, elige la categoría «' + M.CAT_FAVOR + '» para que quede por cobrar.');
    if (b.tipo === 'abono') t.push('Baja la deuda de la tarjeta y resta de los gastos del mes. No sale del débito.');
    return t.join('<br>');
  }
  function formMov(b) {

    bajaCuenta: function (el) {
      var id = el.dataset.id;
      if (!confirm('Si la cuenta tiene movimientos se archiva y conserva su historial; si no, se elimina. ¿Continuar?')) return;
      cerrar(); var r; aplicar(function () { r = M.eliminarCuenta(id); }); toast(r === 'archivada' ? 'Cuenta archivada: su historial se conserva' : 'Cuenta eliminada');
    },
    reactivar: function (el) { var c = JSON.parse(JSON.stringify(M.cta(el.dataset.id))); c.archivada = false; cerrar(); aplicar(function () { M.guardarCuenta(c); }, 'Cuenta reactivada'); },
    saldoManual: function (el) {
      var root = el.closest('.fs'), id = root.dataset.id, n = num(leerForm(root).saldo); if (isNaN(n) || n < 0) return toast('Escribe el saldo.');
      var c = JSON.parse(JSON.stringify(M.cta(id))); c.saldoManual = n;
      aplicar(function () { M.guardarCuenta(c); }, 'Saldo actualizado'); hojaCuenta(id);
    },
    verMovs: function (el) { ui.movs.cta = el.dataset.id; ui.movs.cat = ''; ui.movs.q = ''; ui.movs.est = 'todos'; ui.vista = 'movs'; cerrar(); pintar(); window.scrollTo(0, 0); },
    fijos: hojaFijos,
    fijo: function (el) { hojaFijo(el.dataset.id, el.dataset.t); },
    guardarFijo: function (el) {
      var root = el.closest('.ffi'), id = root.dataset.id, f = leerForm(root), concepto = String(f.concepto || '').trim(), monto = num(f.monto), dias = String(f.dias || '').replace(/\s/g, '').toUpperCase();
      if (!concepto) return toast('Escribe el concepto.');
      if (isNaN(monto) || monto < 0) return toast('Escribe el monto estimado.');
      if (!/^(\d{1,2}|U)(,(\d{1,2}|U))*$/.test(dias)) return toast('Días: números de 1 a 31 separados por coma, o U para el último día.');
      if (f.frecuencia === 'anual' && !f.mes) return toast('Elige el mes del cargo anual.');
      if (!f.cuenta) return toast('Elige la cuenta.');
      var prev = id ? S.fijos.find(function (x) { return x.id === id; }) : null;
      var o = { id: id || 'f-' + (slug(concepto) || 'fijo') + '-' + Math.random().toString(36).slice(2, 5), concepto: concepto, tipo: root.dataset.tipo, cuenta: f.cuenta, categoria: f.categoria, monto: r2(monto), frecuencia: f.frecuencia, dias: dias, mes: f.frecuencia === 'anual' ? +f.mes : '', desde: f.desde, hasta: f.hasta, aproximado: f.aproximado, activa: f.activa, notas: prev ? prev.notas : '' };
      aplicar(function () { M.guardarFijo(o); }, 'Fijo guardado'); hojaFijos();
    },
    eliminarFijo: function (el) { var id = el.dataset.id; if (!confirm('Se elimina el fijo y sus movimientos futuros pendientes. El historial se conserva. ¿Continuar?')) return; aplicar(function () { M.eliminarFijo(id); }, 'Fijo eliminado'); hojaFijos(); },
    categorias: hojaCategorias,
    catDel: function (el) { var k = el.dataset.k, a = S.ajustes[k].slice(); a.splice(+el.dataset.i, 1); var p = {}; p[k] = a; aplicar(function () { M.guardarAjustes(p); }); hojaCategorias(); },
    catAdd: function (el) {
      var cont = el.parentNode, k = cont.dataset.k, v = cont.querySelector('input').value.trim(); if (!v) return;
      if (S.ajustes[k].indexOf(v) >= 0) return toast('Esa categoría ya existe.');
      var p = {}; p[k] = S.ajustes[k].concat([v]); aplicar(function () { M.guardarAjustes(p); }); hojaCategorias();
    },
    parametros: hojaParametros,
    guardarParam: function (el) {
      var f = leerForm(el.closest('.fpa')), pc = num(f.pct_compartido), um = num(f.umbral_uso);
      if (!(pc > 0 && pc <= 100)) return toast('La parte propia va de 1 a 100.');
      if (!(um > 0 && um <= 100)) return toast('La alerta de uso va de 1 a 100.');
      cfg.tema = f.tema; pon(LS.cfg, cfg); aplicarTema(); cerrar();
      aplicar(function () { M.guardarAjustes({ pct_compartido: pc, umbral_uso: um, ajuste_finde: !!f.ajuste_finde, fecha_inicio: f.fecha_inicio || S.ajustes.fecha_inicio }); }, 'Guardado');
    },
    conexion: hojaConexion,
    conectar: function (el) { conectar(el.closest('.fco')); },
    local: function () { cfg.modo = 'local'; cfg.url = ''; cfg.clave = ''; pon(LS.cfg, cfg); $('#acceso').hidden = true; pintar(); },
    syncYa: function () { cerrar(); red.vueltas = 0; red.error = ''; sincronizar(); },
    cambiarClave: function (el) {
      var n = String(leerForm(el.closest('.fcl')).nueva || '').trim(); if (n.length < 4) return toast('La clave debe tener al menos 4 caracteres.');
      el.disabled = true;
      api({ accion: 'clave', nueva: n }).then(function (d) { if (!d.ok) throw new Error(d.error); cfg.clave = n; pon(LS.cfg, cfg); cerrar(); toast('Clave cambiada'); })
        .catch(function (e) { el.disabled = false; toast(textoError(e.message)); });
    },
    desconectar: function () {
      if (!confirm('Se borra la copia guardada en este dispositivo. Tu hoja de Google no se toca. ¿Continuar?')) return;
      localStorage.removeItem(LS.est); localStorage.removeItem(LS.cola); localStorage.removeItem(LS.cfg); location.reload();
    },
    respaldo: hojaRespaldo,
    descargar: function () {
      var a = document.createElement('a'), u = URL.createObjectURL(new Blob([JSON.stringify(paquete(), null, 1)], { type: 'application/json' }));
      a.href = u; a.download = 'finanzas_respaldo_' + M.hoy() + '.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(u); }, 8000);
    },
    filtro: function (el) { var g = el.dataset.g, v = el.dataset.v; if (g === 'est') { ui.pagos.est[v] = ui.pagos.est[v] ? 0 : 1; } else ui.pagos[g] = v; pintar(); },
    fest: function (el) { ui.movs.est = el.dataset.v; pintar(); },
    mes: function (el) { ui.movs.mes = M.addMonths(ui.movs.mes + '-01', +el.dataset.d, 1).slice(0, 7); pintar(); }
  };

  /* ---------- eventos ---------- */
  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-a]') : null;
    if (!el) { if (e.target.classList && e.target.classList.contains('fondo')) cerrar(); return; }
    var fn = acc[el.dataset.a]; if (fn) { e.preventDefault(); fn(el, e); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !$('#hoja').hidden) cerrar();
    if ((e.key === 'Enter' || e.key === ' ') && e.target.getAttribute && e.target.getAttribute('role') === 'button') { e.preventDefault(); e.target.click(); }
  });
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.id === 'busca') { ui.movs.q = t.value; $('#lmovs').innerHTML = listaMovs(); return; }
    if (t.closest('.fm') || t.closest('.fc')) actualizaCalc(t);
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.dataset.c === 'fcta') { ui.movs.cta = t.value; pintar(); }
    else if (t.dataset.c === 'fcat') { ui.movs.cat = t.value; pintar(); }
    else if (t.dataset.r && t.closest('.fm')) repintaForm(t);
    else if (t.id === 'archivo') leerArchivo(t);
    else if (t.name === 'frecuencia' && t.closest('.ffi')) { var d = t.closest('.ffi').querySelector('[name=dias]'); if (!d.value) d.value = { semanal: '7,14,21,28', quincenal: '15,U' }[t.value] || ''; }
  });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') return;
    M.tomarLog(); M.regenerar(); encolar(M.tomarLog()); guardarLocal(); if ($('#hoja').hidden) refrescar();
    if (Date.now() - red.ultimo > 30000) programarSync(0);
  });
  window.addEventListener('online', function () { programarSync(0); });

  /* ---------- arranque ---------- */
  aplicarTema();
  M.tomarLog(); M.regenerar(); encolar(M.tomarLog()); guardarLocal();
  pintar();
  if (!cfg.url && cfg.modo !== 'local') mostrarAcceso(); else programarSync(0);
})();
</script>
</body>
</html>
