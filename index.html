<!--
  App de finanzas personales. Un solo archivo: estilos, pantallas y cálculos.
  No contiene datos ni claves: todo vive en tu hoja de Google y viaja con tu clave.
-->
<style>
/* Paleta estilo Valle: lienzo gris muy claro, tarjetas blancas con línea fina, esmeralda para lo positivo,
   ámbar solo para "cuidado" y rojo solo para "rebasado". Cada color significa una sola cosa. */
:root{
  --bg:#F8FAFC; --sup:#FFFFFF; --sup2:#F1F5F9; --tinta:#0F172A; --gris:#64748B; --linea:#E2E8F0;
  --marca:#047857; --cabeza:#0F172A; --btn:#047857; --pos:#047857; --neg:#DC2626; --aviso:#F59E0B; --avi-t:#B45309; --tc:#2563EB; --comp:#7C3AED; --prest:#A16207;
  --pos-s:#ECFDF5; --neg-s:#FEF2F2; --aviso-s:#FFFBEB; --tc-s:#EFF6FF; --comp-s:#F5F3FF; --gris-s:#F1F5F9;
  --sombra:0 1px 3px rgba(15,23,42,.04),0 1px 2px -1px rgba(15,23,42,.03);
  --num:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --disp:"Plus Jakarta Sans",ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,sans-serif;
  --txt:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0B1120; --sup:#131C2E; --sup2:#1E293B; --tinta:#E2E8F0; --gris:#94A3B8; --linea:#25324A;
  --marca:#34D399; --cabeza:#0B1120; --btn:#059669; --pos:#34D399; --neg:#F87171; --aviso:#FBBF24; --avi-t:#FBBF24; --tc:#60A5FA; --comp:#A78BFA; --prest:#D6A26B;
  --pos-s:#0F2E25; --neg-s:#3A1A1D; --aviso-s:#3A2E12; --tc-s:#172A4A; --comp-s:#2A2147; --gris-s:#1E293B;
  --sombra:none; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0B1120; --sup:#131C2E; --sup2:#1E293B; --tinta:#E2E8F0; --gris:#94A3B8; --linea:#25324A;
  --marca:#34D399; --cabeza:#0B1120; --btn:#059669; --pos:#34D399; --neg:#F87171; --aviso:#FBBF24; --avi-t:#FBBF24; --tc:#60A5FA; --comp:#A78BFA; --prest:#D6A26B;
  --pos-s:#0F2E25; --neg-s:#3A1A1D; --aviso-s:#3A2E12; --tc-s:#172A4A; --comp-s:#2A2147; --gris-s:#1E293B;
  --sombra:none; color-scheme:dark; }

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{height:100%; -webkit-text-size-adjust:100%}
body{margin:0; min-height:100%; background:var(--bg); color:var(--tinta); font:15px/1.4 var(--txt); overscroll-behavior-y:none}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer; border:0; background:none; padding:0; text-align:inherit}
:focus-visible{outline:2px solid var(--tc); outline-offset:2px}
[hidden]{display:none!important}
.num{font-family:var(--num); font-variant-numeric:tabular-nums; letter-spacing:-.01em}
.pos{color:var(--pos)} .neg{color:var(--neg)} .avi{color:var(--aviso)} .gr{color:var(--gris)}

/* estructura */
#app{max-width:560px; margin:0 auto; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column}
#top{position:sticky; top:0; z-index:5; background:var(--cabeza); color:#fff; padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px; display:flex; align-items:center; justify-content:space-between; gap:12px}
#top h1{margin:0; font-size:20px; font-weight:700; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0}
#sync{flex:none; white-space:nowrap; display:flex; align-items:center; gap:6px; color:#fff; font-size:13px; padding:6px 10px; border-radius:99px; background:rgba(255,255,255,.14)}
#sync i{width:8px; height:8px; border-radius:50%; background:#8FE3C2}
#sync.e-pend i{background:#FFD27A} #sync.e-error i{background:#FF9C90} #sync.e-local i{background:#fff; opacity:.6}
#sync.e-sync i{animation:late 1s infinite alternate}
@keyframes late{to{opacity:.25}}
#vista{flex:1; padding:14px 14px calc(env(safe-area-inset-bottom,0px) + 96px)}
#nav{position:fixed; left:0; right:0; bottom:0; z-index:6; background:var(--sup); border-top:1px solid var(--linea); padding:6px max(8px,calc((100vw - 560px)/2)) calc(env(safe-area-inset-bottom,0px) + 6px); display:grid; grid-template-columns:1fr 1fr 76px 1fr 1fr; align-items:end}
#nav button{display:flex; flex-direction:column; align-items:center; gap:2px; font-size:11px; color:var(--gris); padding:4px 0; min-height:48px; justify-content:center}
#nav button svg{width:23px; height:23px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
#nav button.on{color:var(--marca); font-weight:600}
#nav button.mas{color:#fff} #nav button.mas span.c{width:54px; height:54px; margin-top:-22px; border-radius:50%; background:var(--cabeza); display:grid; place-items:center; box-shadow:0 4px 12px rgba(14,107,80,.35); border:3px solid var(--sup)}
#nav button.mas svg{width:26px; height:26px; stroke-width:2.4}
#nav button.mas em{font-style:normal; color:var(--gris)} #nav button.mas.on em{color:var(--marca); font-weight:600}
/* modo oscuro: el verde del encabezado casi se pierde contra la barra (1.7:1); este verde da 4:1 contra la barra y contra el ícono */
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) #nav button.mas span.c{background:#1F8F6B; box-shadow:0 4px 14px rgba(0,0,0,.5)} }
:root[data-theme="dark"] #nav button.mas span.c{background:#1F8F6B; box-shadow:0 4px 14px rgba(0,0,0,.5)}

/* piezas */
.tarj{background:var(--sup); border-radius:18px; padding:16px; margin-bottom:12px}
.tarj h2{margin:0 0 10px; font-size:15px; font-weight:650}
.tarj h2 small{font-weight:400; color:var(--gris); font-size:13px}
.sec{margin:18px 4px 8px; font-size:13px; color:var(--gris); font-weight:600; display:flex; justify-content:space-between; align-items:baseline}
.sec button{color:var(--marca); font-weight:600; font-size:13px; padding:4px 0}
.lista{background:var(--sup); border-radius:18px; overflow:hidden; margin-bottom:12px}
.fila{display:flex; align-items:center; gap:10px; padding:11px 12px 11px 14px; width:100%; border-top:1px solid var(--linea); min-height:56px}
.lista>.fila:first-child, .lista>.dia+.fila{border-top:0}
.dia{padding:8px 14px 4px; font-size:12px; color:var(--gris); font-weight:600; background:var(--sup2)}
.fila>.f{width:38px; flex:none; text-align:center; line-height:1.1}
.fila>.f b{display:block; font:700 17px var(--num)} .fila>.f span{font-size:11px; color:var(--gris)}
.fila>.c{flex:1; min-width:0}
.fila .c1{font-weight:550; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; line-height:1.25}
.fila .c2{font-size:12.5px; color:var(--gris); display:flex; flex-wrap:wrap; gap:3px 6px; align-items:center; margin-top:1px}
.fila>.m{flex:none; text-align:right; font:600 15px var(--num); font-variant-numeric:tabular-nums}
.fila>.m small{display:block; font:400 11.5px var(--txt); color:var(--gris)}
.fila.no .c1,.fila.no>.m{text-decoration:line-through; color:var(--gris)}
.fila.ten{opacity:.72}
.ok{flex:none; width:40px; height:40px; border-radius:50%; border:1.6px solid var(--marca); color:var(--marca); display:grid; place-items:center}
.ok svg{width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round}
.et{display:inline-block; font-size:11px; font-weight:600; padding:1px 7px; border-radius:99px; background:var(--gris-s); color:var(--gris); white-space:nowrap}
.et.a{background:var(--aviso-s); color:var(--aviso)} .et.r{background:var(--neg-s); color:var(--neg)} .et.v{background:var(--pos-s); color:var(--pos)}
.et.m{background:var(--comp-s); color:var(--comp)} .et.z{background:var(--tc-s); color:var(--tc)}
.vacio{padding:26px 16px; text-align:center; color:var(--gris)}
.chips{display:flex; gap:6px; overflow-x:auto; padding:2px 2px 8px; scrollbar-width:none; margin:0 -2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none; padding:7px 13px; border-radius:99px; background:var(--sup); color:var(--tinta); font-size:13.5px; border:1px solid var(--linea)}
.chip.on{background:var(--tinta); color:var(--bg); border-color:var(--tinta); font-weight:600}
.btn{display:flex; align-items:center; justify-content:center; width:100%; min-height:48px; padding:10px 16px; border-radius:13px; background:var(--cabeza); color:#fff; font-weight:650; font-size:16px}
.btn.sec2{background:var(--sup2); color:var(--tinta)} .btn.pel{background:transparent; color:var(--neg); min-height:44px} .btn.lin{background:transparent; color:var(--marca); min-height:44px}
.btn:disabled{opacity:.5}
.btns{display:grid; gap:8px; margin-top:16px} .btns.dos{grid-template-columns:1fr 1fr}

/* barrera de presupuesto */
.gran{font:700 40px/1.05 var(--num); font-variant-numeric:tabular-nums; letter-spacing:-.02em; margin:2px 0 2px}
.barrera{display:flex; height:22px; border-radius:7px; overflow:hidden; background:var(--sup2); margin:14px 0 6px; position:relative}
.barrera i{display:block; height:100%}
.barrera .g{background:var(--tinta)} .barrera .p{background:repeating-linear-gradient(135deg,var(--aviso) 0 5px,transparent 5px 8px),var(--aviso-s)}
.barrera .d{background:var(--pos)} .barrera .x{background:repeating-linear-gradient(135deg,var(--neg) 0 5px,transparent 5px 8px),var(--neg-s)}
.barrera .f1{background:var(--tinta)} .barrera .f2{background:repeating-linear-gradient(135deg,var(--tinta) 0 5px,transparent 5px 8px),var(--gris-s)}
.barrera .v1{background:var(--aviso)} .barrera .v2{background:repeating-linear-gradient(135deg,var(--aviso) 0 5px,transparent 5px 8px),var(--aviso-s)}
.tope{position:relative; height:16px; font-size:11px; color:var(--gris)}
.tope span{position:absolute; top:0; transform:translateX(-100%); white-space:nowrap; padding-right:4px; border-right:2px solid var(--tinta); line-height:14px}
.cta{width:100%; border-collapse:collapse; margin-top:6px}
.cta td{padding:5px 0; vertical-align:baseline} .cta td:last-child{text-align:right; font-family:var(--num); font-variant-numeric:tabular-nums; white-space:nowrap}
.cta td small{display:block; color:var(--gris); font-size:12px}
.cta .ley{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:7px}
.cta tr.tot td{border-top:1px solid var(--linea); font-weight:700; padding-top:8px}
.tabla{width:100%; border-collapse:collapse}
.tabla th{font-size:12px; color:var(--gris); font-weight:500; text-align:right; padding:0 0 4px}
.tabla td{font-size:14px; padding:7px 0 7px 10px; border-top:1px solid var(--linea); text-align:right; font-family:var(--num); font-variant-numeric:tabular-nums; white-space:nowrap}
.tabla td:first-child{text-align:left; font-family:var(--txt); font-size:15px; white-space:normal; padding-left:0}
.tabla tr.tot td{font-weight:700}
.uso{height:6px; border-radius:3px; background:var(--sup2); overflow:hidden; margin-top:6px}
.uso i{display:block; height:100%; background:var(--pos); border-radius:3px} .uso.a i{background:var(--aviso)} .uso.r i{background:var(--neg)}
.alerta{display:flex; gap:10px; align-items:flex-start; padding:10px 14px; border-top:1px solid var(--linea); width:100%}
.lista>.alerta:first-child{border-top:0}
.alerta i{flex:none; width:8px; height:8px; border-radius:50%; margin-top:6px; background:var(--aviso)} .alerta.r i{background:var(--neg)} .alerta.g i{background:var(--gris)}
.alerta b{font-weight:600} .alerta span{display:block; font-size:12.5px; color:var(--gris)}
.nota{font-size:13px; color:var(--gris); margin:6px 2px}
.banda{background:var(--aviso-s); color:var(--aviso); border-radius:12px; padding:10px 12px; font-size:13.5px; margin-bottom:12px}
.banda.r{background:var(--neg-s); color:var(--neg)}
.mesnav{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px}
.mesnav b{font-size:17px; text-transform:capitalize} .mesnav button{width:44px; height:44px; border-radius:50%; background:var(--sup); font-size:20px; text-align:center; color:var(--tinta)}
.filtros{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px}
.filtros input{grid-column:1/-1}

/* formularios */
.campo{display:block; margin-bottom:12px}
.campo>span{display:block; font-size:13px; color:var(--gris); margin-bottom:4px; font-weight:500}
.campo small{display:block; font-size:12.5px; color:var(--gris); margin-top:4px}
input,select,textarea{width:100%; min-height:48px; padding:10px 12px; border-radius:12px; border:1px solid var(--linea); background:var(--sup); font-size:17px; -webkit-appearance:none; appearance:none}
#vista input,#vista select{background-color:var(--sup)}
.panel input,.panel select,.panel textarea{background-color:var(--bg)}
select{background-image:linear-gradient(45deg,transparent 50%,var(--gris) 50%),linear-gradient(135deg,var(--gris) 50%,transparent 50%); background-position:calc(100% - 18px) 21px,calc(100% - 13px) 21px; background-size:5px 5px; background-repeat:no-repeat; padding-right:34px}
input[type=checkbox]{width:22px; min-height:22px; height:22px; padding:0; border-radius:6px; flex:none; -webkit-appearance:auto; appearance:auto; accent-color:var(--marca)}
textarea{min-height:70px; resize:vertical}
.monto{font:700 30px var(--num); text-align:right; min-height:60px}
.dos{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.seg{display:flex; background:var(--sup2); border-radius:12px; padding:3px; margin-bottom:12px}
.seg button{flex:1; text-align:center; padding:9px 4px; border-radius:10px; font-size:14px; color:var(--gris); font-weight:550; min-height:42px}
.seg button.on{background:var(--sup); color:var(--tinta); box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chk{display:flex; align-items:center; gap:10px; margin-bottom:12px; font-size:15px}
.calc{background:var(--sup2); border-radius:12px; padding:10px 12px; font-size:14px; margin-bottom:12px}
.calc b{font-family:var(--num)}

/* hoja inferior */
#hoja{position:fixed; inset:0; z-index:20}
#hoja .fondo{position:absolute; inset:0; background:rgba(0,0,0,.45)}
.panel{position:absolute; left:0; right:0; bottom:0; max-width:560px; margin:0 auto; max-height:92dvh; max-height:92vh; overflow-y:auto; background:var(--sup); border-radius:22px 22px 0 0; padding:8px 16px calc(env(safe-area-inset-bottom,0px) + 20px); animation:sube .22s ease-out; -webkit-overflow-scrolling:touch}
@supports (max-height:92dvh){ .panel{max-height:92dvh} }
@keyframes sube{from{transform:translateY(40px); opacity:0}}
.panel .asa{width:38px; height:4px; border-radius:2px; background:var(--linea); margin:0 auto 10px}
.panel h2{margin:0 0 4px; font-size:19px; letter-spacing:-.01em} .panel h3{margin:18px 0 8px; font-size:14px; color:var(--gris); font-weight:600}
.panel .sub{color:var(--gris); font-size:13.5px; margin:0 0 14px}
.panel .lista{background:var(--bg)} .panel .tarj{background:var(--bg)}
.cierra{position:sticky; top:0; float:right; width:36px; height:36px; border-radius:50%; background:var(--sup2); text-align:center; font-size:18px; line-height:36px; z-index:2}
.dato{display:flex; justify-content:space-between; gap:12px; padding:7px 0; border-top:1px solid var(--linea)}
.dato:first-of-type{border-top:0} .dato b{font-family:var(--num); font-variant-numeric:tabular-nums; text-align:right}

/* acceso */
#acceso{position:fixed; inset:0; z-index:30; background:var(--bg); overflow-y:auto; padding:calc(env(safe-area-inset-top,0px) + 36px) 22px 40px}
#acceso .caja{max-width:440px; margin:0 auto}
#acceso h1{font-size:30px; letter-spacing:-.02em; margin:0 0 6px} #acceso p{color:var(--gris); margin:0 0 20px}
#acceso .err{color:var(--neg); font-size:14px; margin:-4px 0 12px}
#toast{position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 92px); transform:translateX(-50%) translateY(20px); background:var(--tinta); color:var(--bg); padding:10px 16px; border-radius:99px; font-size:14px; opacity:0; pointer-events:none; transition:opacity .2s,transform .2s; z-index:40; max-width:88vw; text-align:center}
#toast.on{opacity:1; transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){ *{animation:none!important; transition:none!important} }
@media (min-width:600px){ #vista{padding-top:20px} }

/* ===================== v2: tablero, formulario y gráficas ===================== */
:root{ --abono:#0891B2; --abono-s:#ECFEFF; --prest-s:#FEF9C3;
  --k1:#2563EB; --k2:#059669; --k3:#F59E0B; --k4:#E11D48; --k5:#7C3AED; --k6:#0891B2; --k7:#EA580C; --k8:#94A3B8 }
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --abono:#22D3EE; --abono-s:#0E2F3A; --prest-s:#332A12;
  --k1:#60A5FA; --k2:#34D399; --k3:#FBBF24; --k4:#FB7185; --k5:#A78BFA; --k6:#22D3EE; --k7:#FB923C; --k8:#64748B } }
:root[data-theme="dark"]{ --abono:#22D3EE; --abono-s:#0E2F3A; --prest-s:#332A12;
  --k1:#60A5FA; --k2:#34D399; --k3:#FBBF24; --k4:#FB7185; --k5:#A78BFA; --k6:#22D3EE; --k7:#FB923C; --k8:#64748B }

details>summary{list-style:none; cursor:pointer} details>summary::-webkit-details-marker{display:none}
details>summary::after{content:''; flex:none; width:7px; height:7px; border-right:2px solid currentColor; border-bottom:2px solid currentColor; transform:rotate(45deg); margin:-3px 4px 0 auto; transition:transform .15s}
details[open]>summary::after{transform:rotate(-135deg); margin-top:3px}
.cab{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:10px} .cab h2{margin:0}

/* tablero de inicio */
.hero{border-radius:22px; padding:16px 16px 12px; margin-bottom:12px; background:var(--pos-s)}
.hero.mal{background:var(--neg-s)}
.hero-c{display:flex; justify-content:space-between; align-items:center; gap:8px; font-weight:650}
.hero-c em{font-style:normal; font-size:12px; font-weight:650; padding:3px 10px; border-radius:99px; background:var(--pos); color:var(--sup); white-space:nowrap}
.hero.mal .hero-c em{background:var(--neg)}
.hero .gran{font-size:clamp(32px,11.5vw,44px); color:var(--pos); margin:8px 0 2px} .hero.mal .gran{color:var(--neg)}
.hero>p{margin:0; font-size:13.5px; opacity:.85}
.hero .barrera{height:26px; border-radius:9px; background:var(--sup); margin:14px 0 4px}
.hero .barrera i+i{border-left:2px solid var(--sup)}
.tiles{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px}
.tile{background:var(--sup); border-radius:12px; padding:8px; min-width:0}
.tarj .tile{background:var(--bg)}
.tile span{display:flex; align-items:flex-start; gap:5px; font-size:11.5px; color:var(--gris); line-height:1.2; min-height:28px}
.tile i{flex:none; width:8px; height:8px; border-radius:3px; margin-top:3px}
.tile b{display:block; font:650 clamp(11.5px,3.5vw,13px) var(--num); font-variant-numeric:tabular-nums; margin-top:2px; white-space:nowrap}
.desg{margin-top:8px} .desg summary{display:flex; align-items:center; font-size:13px; font-weight:600; padding:8px 2px 4px}
.dz{background:var(--sup); border-radius:12px; padding:2px 12px; margin-top:6px; font-size:14px}
.br{margin-top:10px} .br-t{display:flex; justify-content:space-between; gap:8px; font-size:13.5px} .br-t b{font:650 14px var(--num)}
.br-b{display:flex; height:12px; border-radius:6px; background:var(--sup2); overflow:hidden; margin-top:5px}
.br-b i{display:block; height:100%} .br-b i.h{background:repeating-linear-gradient(135deg,var(--aviso) 0 4px,transparent 4px 7px),var(--aviso-s)}
.sl{padding:10px 0; border-top:1px solid var(--linea)} .cab+.sl{border-top:0; padding-top:0}
.sl-t{display:flex; justify-content:space-between; align-items:baseline; gap:8px}
.sl-t span{display:flex; align-items:center; gap:7px} .sl-t i{width:10px; height:10px; border-radius:3px; flex:none} .sl-t b{font:650 16px var(--num); font-variant-numeric:tabular-nums}
.sl-b{position:relative; height:8px; border-radius:4px; background:var(--sup2); margin:7px 0 5px}
.sl-b i{display:block; height:100%; border-radius:4px; min-width:3px} .sl-b u{position:absolute; top:-3px; width:2px; height:14px; margin-left:-1px; background:var(--tinta); border-radius:1px}
.sl-s{font-size:12.5px; color:var(--gris); display:flex; justify-content:space-between} .sl-s b{font:550 13px var(--num); color:var(--tinta)}
.leyenda{font-size:12px; color:var(--gris); display:flex; gap:12px; align-items:center; flex-wrap:wrap}
.leyenda i{display:inline-block; width:14px; height:6px; border-radius:3px; background:var(--gris); margin-right:5px; vertical-align:middle} .leyenda u{display:inline-block; width:2px; height:12px; background:var(--tinta); margin-right:6px; vertical-align:middle}
.total{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px}
.total div{background:var(--tinta); color:var(--bg); border-radius:14px; padding:10px 12px; min-width:0} .total div+div{background:var(--sup2); color:var(--tinta)}
.total span{display:block; font-size:11.5px; opacity:.8} .total b{font:700 15px var(--num); font-variant-numeric:tabular-nums; white-space:nowrap}
.aviso{display:flex; align-items:center; gap:10px; width:100%; padding:12px 14px 12px 16px; border-top:1px solid var(--linea); box-shadow:inset 4px 0 var(--neg)}
.aviso.g{box-shadow:inset 4px 0 var(--gris)} .lista>.aviso:first-child{border-top:0}
.aviso div{flex:1; min-width:0} .aviso b{display:block; font-weight:600} .aviso span{display:block; font-size:12.5px; color:var(--gris)}
.aviso strong{font:650 15px var(--num); font-variant-numeric:tabular-nums; white-space:nowrap}
.medidor{display:block; width:100%; padding:10px 14px 12px; border-top:1px solid var(--linea)} .lista>.medidor:first-child{border-top:0}
.md-t{display:flex; justify-content:space-between; align-items:baseline; gap:8px; font-weight:550} .md-t b{font-family:var(--num)} .md-t small{font-weight:500; color:var(--neg); font-size:12px}
.md-b{position:relative; height:8px; border-radius:4px; background:var(--sup2); margin-top:6px}
.md-b i{display:block; height:100%; border-radius:4px; background:var(--aviso)} .md-b.r i{background:var(--neg)} .md-b.v i{background:var(--pos)}
.md-b u{position:absolute; top:-3px; width:2px; height:14px; margin-left:-1px; background:var(--gris); border-radius:1px}
.plegable{margin:14px 0 12px} .plegable>summary{display:flex; align-items:center; gap:8px; padding:13px 14px; background:var(--sup); border-radius:16px; font-weight:600; font-size:14px}
.plegable[open]>summary{border-radius:16px 16px 0 0; border-bottom:1px solid var(--linea)} .plegable[open]>.lista{border-radius:0 0 16px 16px}
.cnt{background:var(--aviso-s); color:var(--aviso); border-radius:99px; padding:1px 8px; font-size:12px}

/* color funcional en las filas */
.fila.s-ing{box-shadow:inset 3px 0 var(--pos)} .fila.s-gas{box-shadow:inset 3px 0 var(--k8)} .fila.s-tc{box-shadow:inset 3px 0 var(--tc)} .fila.s-ts{box-shadow:inset 3px 0 var(--comp)}
.fila.s-pr{box-shadow:inset 3px 0 var(--prest)} .fila.s-pe{box-shadow:inset 3px 0 var(--aviso)} .fila.s-ab{box-shadow:inset 3px 0 var(--abono)}
.chip i{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px} .chip.s{padding:5px 11px; font-size:12.5px}
.mesh{padding:9px 14px 6px; font-size:13px; font-weight:650; background:var(--sup2)} .mesh::first-letter{text-transform:uppercase}

/* pagos: resumen */
.resu{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:8px; padding:11px 12px; border-radius:12px; background:var(--pos-s); color:var(--pos); font-weight:650}
.resu.mal{background:var(--neg-s); color:var(--neg)} .resu b{font:700 19px var(--num); font-variant-numeric:tabular-nums}
.spark{margin:0 0 4px} .spark svg{display:block; width:100%; height:64px; overflow:visible}
.sp-x{display:flex; justify-content:space-between; font-size:11px; color:var(--gris); margin-top:3px}
.estados{display:flex; align-items:center; gap:6px; margin:16px 2px 8px; font-size:13px; color:var(--gris); font-weight:600; flex-wrap:wrap} .estados span{margin-right:auto}

/* movimientos: gráficas */
.dona-b{position:relative; width:150px; margin:4px auto 12px} .dona{display:block; width:150px; height:150px; transform:rotate(-90deg)}
.dona-c{position:absolute; inset:0; display:grid; place-content:center; text-align:center} .dona-c span{font-size:11.5px; color:var(--gris)} .dona-c b{font:700 16px var(--num); font-variant-numeric:tabular-nums}
.lg{display:block; width:100%; padding:7px 8px; border-radius:10px; text-align:left} .lg.on{background:var(--sup2)}
.lg-t{display:flex; align-items:center; gap:8px; font-size:14px} .lg-t i{width:10px; height:10px; border-radius:3px; flex:none} .lg-t span{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap} .lg-t b{font:600 14px var(--num); font-variant-numeric:tabular-nums}
.lg-b{height:5px; border-radius:3px; background:var(--sup2); margin:5px 0 0 18px; overflow:hidden} .lg-b i{display:block; height:100%; border-radius:3px}
.barras svg{display:block; width:100%; height:auto} .barras text{font:8px var(--txt); fill:var(--gris)}
.filt{margin-bottom:8px} .filt>summary{display:flex; align-items:center; font-size:13.5px; font-weight:600; color:var(--marca); padding:8px 2px} .filt .filtros{margin:4px 0 0}

/* formulario de registro */
.fx{--tk:var(--tinta); --tks:var(--sup2)}
.fx.t-gasto{--tk:var(--neg); --tks:var(--neg-s)} .fx.t-ingreso{--tk:var(--pos); --tks:var(--pos-s)} .fx.t-transferencia{--tk:var(--tc); --tks:var(--tc-s)} .fx.t-abono{--tk:var(--abono); --tks:var(--abono-s)}
.tipos{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:10px}
.tp{display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 2px 8px; border-radius:14px; background:var(--sup); border:1.5px solid transparent; font-size:12.5px; font-weight:600; color:var(--gris); text-align:center}
.tp i{font-style:normal; width:30px; height:30px; border-radius:50%; display:grid; place-items:center; font:700 17px/1 var(--num); background:var(--sup2); color:var(--gris)}
.tp.t-gasto{--c:var(--neg); --cs:var(--neg-s)} .tp.t-ingreso{--c:var(--pos); --cs:var(--pos-s)} .tp.t-transferencia{--c:var(--tc); --cs:var(--tc-s)} .tp.t-abono{--c:var(--abono); --cs:var(--abono-s)}
.tp.on{color:var(--tinta); border-color:var(--c); background:var(--cs)} .tp.on i{background:var(--c); color:var(--sup)}
.panel .tp{background:var(--bg)}
.grp{background:var(--sup); border-radius:16px; padding:12px 14px 14px; margin-bottom:10px; border:1.5px solid transparent}
.panel .grp{background:var(--bg)}
.grp-t{font-size:13px; font-weight:650; margin-bottom:9px; display:flex; align-items:center; gap:7px}
.grp-t::before{content:''; width:4px; height:14px; border-radius:2px; background:var(--tk)}
.grp-a{font-size:12.5px; color:var(--gris); margin:8px 0 0}
.grp.mal{border-color:var(--neg)} .grp-e{color:var(--neg); font-size:13px; font-weight:600; margin:8px 0 0}
.grp>.campo:last-child,.grp>.seg:last-child,.grp>.dos:last-child .campo,.grp>div:last-child>.campo:last-child{margin-bottom:0}
.grp .seg{margin-top:10px} .grp .grp-t+.seg{margin-top:0} .grp .pick+.dos,.grp .seg+.dos,.grp .seg+div,.grp .pick+div{margin-top:10px}
#vista .grp input,#vista .grp select{background-color:var(--bg)} .panel .grp input,.panel .grp select{background-color:var(--sup)}
.montoBox{display:flex; align-items:center; gap:6px; border-radius:14px; background:var(--tks); padding:2px 14px; margin-bottom:8px; border:1.5px solid var(--tk)}
.montoBox .sig{font:700 24px var(--num); color:var(--tk); white-space:nowrap}
.fx .montoBox .monto{border:0; background:transparent; padding:6px 0; min-height:54px; font-size:32px}
.montoBox .monto:focus{outline:0} .montoBox:focus-within{box-shadow:0 0 0 3px var(--tks)}
.pk-g{margin-bottom:10px} .pk-g:last-of-type{margin-bottom:0} .pk-g>span{display:block; font-size:11.5px; color:var(--gris); margin-bottom:5px}
.pk-l{display:flex; flex-wrap:wrap; gap:6px}
.pk{padding:8px 12px; border-radius:11px; background:var(--bg); border:1.5px solid var(--linea); font-size:14.5px; font-weight:550; min-height:42px; display:inline-flex; align-items:center; gap:6px}
.panel .pk{background:var(--sup)}
.pk small{font-size:11.5px; color:var(--gris); font-weight:400}
.pk[class*="c-"]::before{content:''; width:8px; height:8px; border-radius:50%; background:var(--kc)}
.c-din{--kc:var(--pos)} .c-tc{--kc:var(--tc)} .c-ts{--kc:var(--comp)} .c-pr{--kc:var(--prest)} .c-pe{--kc:var(--aviso)}
.pk.on{border-color:var(--tinta); background:var(--tinta); color:var(--bg)} .pk.on small{color:inherit; opacity:.75}
.fechaR{display:flex; gap:6px; align-items:center} .fechaR input{flex:1; min-width:0}
.extra>summary{display:flex; align-items:center; font-size:14px; font-weight:600; color:var(--marca); padding:6px 4px 12px}
.barra{position:sticky; bottom:calc(env(safe-area-inset-bottom,0px) + 70px); z-index:3; background:var(--bg); padding:6px 0 6px; margin-top:4px}
.barra::before{content:''; position:absolute; left:0; right:0; top:-14px; height:14px; background:linear-gradient(transparent,var(--bg)); pointer-events:none}
.res{margin:0 2px 8px; font-size:13.5px; color:var(--gris)} .res b{color:var(--tinta); font-family:var(--num)}

#vista .montoBox .monto,.panel .montoBox .monto{background:transparent}
#toast{top:calc(env(safe-area-inset-top,0px) + 58px); bottom:auto; transform:translateX(-50%) translateY(-12px)}
#toast.on{transform:translateX(-50%)}
details>summary::after{margin:0 4px 0 auto; transform:translateY(-2px) rotate(45deg)}
details[open]>summary::after{margin-top:0; transform:translateY(2px) rotate(-135deg)}
.estados{margin:14px 0 8px}

/* ===================== v3: compacto y consistente ===================== */
.ic{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; vertical-align:-4px; flex:none}
.cierra{display:grid; place-items:center; line-height:1} .cierra .ic{width:16px; height:16px}
.mesnav button{display:grid; place-items:center} .mesnav b::first-letter{text-transform:uppercase}
.chip .ic{width:13px; height:13px; vertical-align:-2px; opacity:.6}
.tp i svg{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round}
/* eje de la gráfica de pagos */
.spark svg{height:72px}
.eje{position:relative; height:15px; margin-top:3px; font:10px/15px var(--num); font-variant-numeric:tabular-nums; color:var(--gris)}
.eje span{position:absolute; top:0; transform:translateX(-50%); white-space:nowrap} .eje span.i{transform:none} .eje span.f{transform:translateX(-100%)}
.eje:not(.m) span:first-child{color:var(--tinta); font-weight:700}
.eje.m{font:600 10.5px/15px var(--txt); color:var(--tinta); margin-top:0} .eje.m span{transform:none} .eje.m span.f{transform:translateX(-100%)}
/* grupos plegables por mes */
.mesg{margin-bottom:10px} .mesg>summary{display:flex; align-items:center; gap:8px; padding:12px 14px; background:var(--sup); border-radius:16px; font-weight:650; font-size:14px}
.mesg[open]>summary{border-radius:16px 16px 0 0; border-bottom:1px solid var(--linea)} .mesg>.lista{margin-bottom:0} .mesg[open]>.lista{border-radius:0 0 16px 16px}
.cnt.n{background:var(--sup2); color:var(--gris)}
.filt>summary span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
/* comparación de meses */
.barras text{font:9px var(--num); fill:var(--gris)}
.meses6{display:grid; grid-template-columns:repeat(6,1fr); margin-top:2px}
.meses6 button{display:flex; flex-direction:column; align-items:center; padding:6px 0 4px; font-size:12.5px; color:var(--gris); border-radius:9px; min-height:40px; text-align:center}
.meses6 button.on{color:var(--tinta); font-weight:700} .meses6 small{font-size:10px; font-weight:400; color:var(--gris)}
/* formulario en filas */
.rws{background:var(--sup); border-radius:16px; padding:2px 14px; margin-bottom:10px} .panel .rws{background:var(--bg)}
.rw{display:grid; grid-template-columns:86px minmax(0,1fr); align-items:center; gap:4px 10px; padding:8px 0; border-top:1px solid var(--linea)}
.rw:first-child{border-top:0} .rw.ancha{grid-template-columns:minmax(0,1fr)} .rw.pegada{border-top:0; padding-top:0}
.rw-l{font-size:13.5px; font-weight:600; display:flex; align-items:center; gap:7px; line-height:1.2}
.rw-l::before{content:''; flex:none; width:4px; height:14px; border-radius:2px; background:var(--tk)}
.rw .seg{margin:0} .rw input,.rw select{min-height:44px; padding-top:8px; padding-bottom:8px; font-size:16px}
.rw select{background-position:calc(100% - 18px) 19px,calc(100% - 13px) 19px}
#vista .rws input,#vista .rws select{background-color:var(--bg)} .panel .rws input,.panel .rws select{background-color:var(--sup)}
.rw.mal .rw-l{color:var(--neg)} .rw.mal input,.rw.mal select{border-color:var(--neg)} .rw .grp-e{grid-column:1/-1; margin:0 0 2px}
.selc{position:relative} .selc::before{content:''; position:absolute; left:12px; top:50%; width:8px; height:8px; margin-top:-4px; border-radius:50%; background:var(--kc,transparent); pointer-events:none}
.selc[class*="c-"] select{padding-left:28px}
.fechaR .pk{padding:6px 10px; min-height:44px; font-size:14px}
.grp>input+.grp-a{margin-top:8px}

.rw{grid-template-columns:96px minmax(0,1fr)}
/* hoja de presupuestos: nombre de categoría a la izquierda, tope a la derecha */
.fpr{--tk:var(--marca)}
.fpr .rw{grid-template-columns:minmax(0,1fr) 124px; align-items:center}
.fpr .rw-l{font-size:14.5px; flex-wrap:wrap}
.fpr .rw-l small{flex-basis:100%; margin:2px 0 0 11px; font-weight:400; color:var(--gris); font-size:11.5px}
.fpr .rw input{text-align:right}
.fpr .calc{margin-bottom:10px}
.medidor .md-t small{font-weight:400}
.fechaR{gap:5px} .fechaR .pk{padding:6px 9px; font-size:13.5px} .fechaR input{padding-left:8px; padding-right:6px}
.eje:not(.m) span:first-child{color:var(--gris); font-weight:400} .eje:not(.m) span.i{color:var(--tinta); font-weight:700}
.eje.m span.f{transform:translateX(-100%)}
#vista .montoBox .monto:focus,.panel .montoBox .monto:focus{background-color:transparent}

/* ===================== v4: estilo Valle, limpio y gráfico ===================== */
body{font:15px/1.45 var(--txt); -webkit-font-smoothing:antialiased}
.num,.fila>.m,.tile b,.dato b,.sl-t b,.sl-s b,.md-t b,.br-t b,.lg-t b,.tabla td,.cta td:last-child,.cat-s b,.duo b,.neto b,.bal-r b{font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1}
.avi{color:var(--avi-t)}

/* encabezado oscuro y compacto (el reloj del iPhone sigue visible en blanco) */
#top{background:var(--cabeza); border-bottom:1px solid rgba(255,255,255,.06); padding-bottom:12px}
#top h1{font:700 20px/1.2 var(--disp); letter-spacing:-.02em}
#sync{background:rgba(255,255,255,.1); font-size:12.5px}
#vista{padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 104px)}

/* barra inferior translúcida, botón central esmeralda */
#nav{background:var(--sup); background:color-mix(in srgb,var(--sup) 92%,transparent); -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px)}
#nav button{font-size:10.5px; font-weight:500}
#nav button.mas span.c{background:var(--btn); box-shadow:0 6px 16px rgba(4,120,87,.3)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) #nav button.mas span.c{background:var(--btn); box-shadow:0 6px 16px rgba(0,0,0,.5)} }
:root[data-theme="dark"] #nav button.mas span.c{background:var(--btn); box-shadow:0 6px 16px rgba(0,0,0,.5)}

/* tarjetas: blanco, línea fina, sombra casi imperceptible; sin cajas dentro de cajas */
.tarj,.lista,.mesg>summary,.plegable>summary,.rws,.grp,.mesnav{border:1px solid var(--linea); box-shadow:var(--sombra)}
.tarj{border-radius:16px; padding:16px; margin-bottom:12px}
.lista{border-radius:16px; margin-bottom:12px}
.mesg[open]>.lista,.plegable[open]>.lista{border-top:0}
.tarj h2,.panel h2,#acceso h1{font-family:var(--disp); letter-spacing:-.015em}
.tarj h2{font-size:16px; font-weight:600}
.cab{margin-bottom:8px}
.eti{display:block; font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--gris)}
.sec{margin:22px 4px 10px; font:600 16px/1.2 var(--disp); color:var(--tinta); letter-spacing:-.01em; align-items:center}
.sec button{font:600 13px var(--txt)}
.nota{font-size:12.5px}
.tarj .dz{background:transparent; padding:0}
.desg summary{color:var(--gris); padding-top:12px}

/* cifras grandes: Plus Jakarta, centavos más chicos */
.gran{font:700 34px/1.1 var(--disp); letter-spacing:-.03em; margin:4px 0 2px; color:var(--tinta)}
.gran.sm{font-size:28px}
.gran .cts{font-size:.52em; font-weight:600; letter-spacing:0; opacity:.6}
.gran.neg{color:var(--neg)} .gran.pos{color:var(--pos)}

/* barrera de presupuesto: delgada y redondeada */
.barrera{height:12px; border-radius:99px; background:var(--sup2); margin:16px 0 8px}
.barrera i+i{border-left:2px solid var(--sup)}
.leyenda{font-size:11.5px; gap:6px 12px}
.leyenda i{width:8px; height:8px; border-radius:50%}
.leyenda u{height:10px}
.tope{margin-top:-2px}

/* resúmenes en columnas separadas por líneas, no en cajitas */
.tiles{gap:0; margin-top:14px; padding-top:12px; border-top:1px solid var(--linea)}
.tile,.tarj .tile{background:transparent; border-radius:0; padding:0 10px; border-left:1px solid var(--linea)}
.tile:first-child{padding-left:0; border-left:0}
.tile span{font-size:11.5px; min-height:0; align-items:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tile i{width:7px; height:7px; border-radius:50%; margin-top:0}
.tile b{font:650 clamp(13.5px,4.2vw,16px) var(--num); margin-top:3px}

/* ritmo diario dentro de la tarjeta principal */
.ritmo{display:flex; align-items:center; gap:10px; margin-top:14px; padding-top:12px; border-top:1px solid var(--linea)}
.ritmo p{flex:1; margin:0; font-size:13px; color:var(--gris); line-height:1.4}
.ritmo p b{color:var(--tinta); font-weight:600}
.ritmo .et{flex:none}

/* íconos de categoría: cuadrito con el color de la categoría, tenue */
.bdg{flex:none; width:38px; height:38px; border-radius:12px; display:grid; place-items:center; color:var(--kc,var(--gris)); background:var(--sup2); background:color-mix(in srgb,var(--kc,var(--gris)) 14%,transparent)}
.bdg svg{width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round}
.bdg.s{width:28px; height:28px; border-radius:9px} .bdg.s svg{width:16px; height:16px}

/* filas de movimientos */
.fila{gap:12px; padding:12px 14px; min-height:62px}
.fila .c1{font-weight:600; font-size:14.5px}
.fila .c2{font-size:12.5px; margin-top:2px}
.fila>.m{font:600 15px var(--num)}
.fila>.m small{font:500 11.5px var(--txt); margin-top:2px}
.fila.s-ing,.fila.s-gas,.fila.s-tc,.fila.s-ts,.fila.s-pr,.fila.s-pe,.fila.s-ab{box-shadow:none}
.ok{width:36px; height:36px; border-width:1.5px}
.dia{background:transparent; padding:12px 14px 2px; font-size:12px; text-transform:capitalize}
.lista>.fila+.dia{border-top:1px solid var(--linea)}
.fila .md-b.full{flex-basis:100%; margin:8px 0 2px 50px}

/* etiquetas y píldoras */
.et{font-size:11px; padding:2px 8px}
.et.a,.cnt,.banda{color:var(--avi-t)}
.banda{border-radius:12px}
.pill{flex:none; font-style:normal; font-size:11px; font-weight:700; padding:2px 9px; border-radius:99px; background:var(--pos-s); color:var(--pos)}
.pill.a{background:var(--aviso-s); color:var(--avi-t)} .pill.r{background:var(--neg-s); color:var(--neg)}

/* barras de avance: verde bien, ámbar cuidado, rojo rebasado */
.md-b{height:8px; border-radius:99px; background:var(--sup2)}
.md-b i{border-radius:99px}
.uso{height:8px; border-radius:99px} .uso i{border-radius:99px}
.sl-b{height:8px; border-radius:99px} .sl-b i{border-radius:99px}
.br-b{height:10px; border-radius:99px}

/* presupuesto: anillo + categorías con ícono */
.pres-top{display:flex; align-items:center; gap:14px}
.anillo{position:relative; width:66px; height:66px; flex:none}
.anillo svg{width:100%; height:100%; display:block}
.anillo b{position:absolute; inset:0; display:grid; place-items:center; font:700 14px var(--disp)}
.pres-t{display:flex; flex-direction:column; gap:2px; min-width:0}
.pres-t b{font:700 21px var(--disp); letter-spacing:-.02em} .pres-t b span{font:500 13px var(--txt); color:var(--gris); letter-spacing:0}
.pres-t small{font-size:12.5px; color:var(--gris)}
.cats{margin-top:14px; border-top:1px solid var(--linea)}
.cat{display:flex; gap:12px; align-items:flex-start; width:100%; padding:12px 0; border-bottom:1px solid var(--linea); text-align:left}
.cat:last-child{border-bottom:0; padding-bottom:0}
.cat-c{flex:1; min-width:0}
.cat-t{display:flex; justify-content:space-between; align-items:center; gap:8px; font-weight:600; font-size:14.5px; min-height:22px}
.cat-t span{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.cat .md-b{margin:8px 0 6px}
.cat-s{display:flex; justify-content:space-between; gap:8px; font-size:12px; color:var(--gris)}
.cat-s span{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.cat-s b{font:600 12px var(--num); white-space:nowrap}

/* avisos: ícono en lugar de franja de color */
.aviso,.aviso.g{box-shadow:none; gap:12px; padding:12px 14px}
.md-row{display:flex; gap:12px; align-items:center} .md-c{flex:1; min-width:0}
.medidor .md-t small{color:var(--gris); font-weight:400}

/* saldos */
.sl-t b{font:650 15px var(--num)}
.sl-s{font-size:12px}

/* cuentas: panorama en dos columnas */
.duo{display:grid; grid-template-columns:1fr 1fr; margin-top:6px}
.duo>div{display:flex; flex-direction:column; gap:2px; min-width:0; padding-right:12px}
.duo>div+div{padding:0 0 0 14px; border-left:1px solid var(--linea)}
.duo span{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--gris)}
.duo i{width:7px; height:7px; border-radius:50%; flex:none}
.duo b{font:700 clamp(18px,6vw,23px) var(--disp); letter-spacing:-.02em; white-space:nowrap}
.duo small{font-size:11.5px; color:var(--gris)}
.neto{display:flex; justify-content:space-between; align-items:baseline; margin-top:14px; padding-top:12px; border-top:1px solid var(--linea); font-size:13px; color:var(--gris)}
.neto b{font:700 17px var(--num); color:var(--tinta)} .neto b.neg{color:var(--neg)}
.cnt.n{font:600 12px var(--txt)}

/* movimientos: selector de mes en píldora, balance y buscador */
.mesnav{background:var(--sup); border-radius:99px; padding:4px; margin:0 auto 12px; max-width:300px}
.mesnav button{width:38px; height:38px; background:var(--sup2)}
.mesnav b{font:600 16px var(--disp); letter-spacing:-.01em}
.bal{display:flex; justify-content:space-between; align-items:flex-end; gap:10px; flex-wrap:wrap}
.bal-r{display:flex; gap:16px; text-align:right}
.bal-r span{display:flex; flex-direction:column; font-size:11.5px; color:var(--gris)}
.bal-r b{font:600 14px var(--num); color:var(--tinta)} .bal-r b.pos{color:var(--pos)}
.busca{position:relative; margin-bottom:6px}
.busca svg{position:absolute; left:14px; top:50%; width:18px; height:18px; margin-top:-9px; fill:none; stroke:var(--gris); stroke-width:2; stroke-linecap:round; pointer-events:none}
#vista .busca input{padding-left:42px; border-radius:14px; box-shadow:var(--sombra)}
.dona-b{width:176px} .dona{width:176px; height:176px}
.dona-c b{font:700 19px var(--disp); letter-spacing:-.02em}
.dona-c em{font-style:normal; font-size:11px; color:var(--gris); max-width:110px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.lg{padding:8px 6px}
.lg-t{gap:10px}
.lg-t em{font-style:normal; font-size:11.5px; color:var(--gris); min-width:36px; text-align:right}
.lg-b{margin:6px 0 0 38px; height:5px; border-radius:99px}

/* controles */
input,select,textarea{border-radius:12px; font-size:16px}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--pos); box-shadow:0 0 0 3px var(--pos-s)}
.montoBox .monto:focus{box-shadow:none}
.btn{background:var(--btn); border-radius:12px; font-weight:600; font-size:15.5px}
.btn.sec2{background:var(--sup); color:var(--tinta); border:1px solid var(--linea)}
.panel .btn.sec2{background:var(--bg)}
.btn.pel,.btn.lin{background:transparent; border:0}
.seg{border-radius:12px}
.seg button.on{box-shadow:0 1px 3px rgba(15,23,42,.12)}
.tp{border-color:var(--linea); box-shadow:var(--sombra)}
.chip{box-shadow:var(--sombra)}

/* hoja inferior */
#hoja .fondo{background:rgba(15,23,42,.42)}
.panel{border-radius:20px 20px 0 0}

/* el ícono va dentro de filas que tienen reglas para <span>: que nunca las herede */
span.bdg{display:grid!important; flex:none!important; width:38px!important; height:38px!important; color:var(--kc,var(--gris))!important; overflow:visible!important; margin:0!important; font-size:0!important}
span.bdg.s{width:28px!important; height:28px!important}
.barrera i[style^="width:0%"]{display:none}

/* ===================== v5: navegación, presupuestos, análisis y categorías ===================== */
/* barra inferior de cinco secciones; registrar es un botón flotante */
#nav{grid-template-columns:repeat(5,minmax(0,1fr)); align-items:center}
#nav button{min-width:0; font-size:10.5px; white-space:nowrap; letter-spacing:-.01em}
#nav button svg{width:22px; height:22px}
#fab{position:fixed; z-index:7; right:max(16px,calc((100vw - 560px)/2 + 16px)); bottom:calc(env(safe-area-inset-bottom,0px) + 76px); width:56px; height:56px; border-radius:50%; background:var(--btn); color:#fff; display:grid; place-items:center; box-shadow:0 8px 20px rgba(4,120,87,.32),0 2px 6px rgba(15,23,42,.12)}
#fab svg{width:26px; height:26px; fill:none; stroke:currentColor; stroke-width:2.4; stroke-linecap:round}
#fab:active{transform:scale(.95)}
body.en-registro #fab{display:none}
#vista{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 150px)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) #fab{box-shadow:0 8px 20px rgba(0,0,0,.5)} }
:root[data-theme="dark"] #fab{box-shadow:0 8px 20px rgba(0,0,0,.5)}

/* pestañas dentro de una pantalla */
.seg.tabs{margin-bottom:14px}
.seg .cnt{font-size:11px; padding:0 6px; margin-left:4px}

/* barra de presupuesto: sólido = gastado, rayado = planeado */
.pb{display:flex; height:8px; border-radius:99px; background:var(--sup2); overflow:hidden}
.pb i{display:block; height:100%; background:var(--pos)}
.pb.a i{background:var(--aviso)} .pb.r i{background:var(--neg)}
.pb i.p{background:repeating-linear-gradient(135deg,var(--pos) 0 4px,transparent 4px 7px),var(--pos-s)}
.pb.a i.p{background:repeating-linear-gradient(135deg,var(--aviso) 0 4px,transparent 4px 7px),var(--aviso-s)}
.pb.r i.p{background:repeating-linear-gradient(135deg,var(--neg) 0 4px,transparent 4px 7px),var(--neg-s)}
.cat .pb{margin:8px 0 6px}
.leyenda i.ray{background:repeating-linear-gradient(135deg,var(--gris) 0 3px,transparent 3px 5px)}
.leyenda i.raya{height:0; border-top:2px dashed var(--aviso); background:none; border-radius:0}
.ver{display:flex; align-items:center; gap:4px; margin-top:12px; font-size:13px; font-weight:600; color:var(--marca)}
.aviso .pill{flex:none}
.dz .dato:first-child{border-top:0}

/* análisis */
.kpis{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); margin-top:4px}
.kpis>div{display:flex; flex-direction:column; gap:3px; min-width:0; padding:0 10px; border-left:1px solid var(--linea)}
.kpis>div:first-child{padding-left:0; border-left:0}
.kpis span{display:flex; align-items:center; gap:5px; font-size:11.5px; color:var(--gris)}
.kpis span i{width:7px; height:7px; border-radius:50%; flex:none}
.kpis b{font:700 clamp(15px,4.6vw,19px) var(--disp); letter-spacing:-.02em; white-space:nowrap; font-variant-numeric:tabular-nums}
.kpi-s{display:flex; gap:10px; align-items:center; font-size:12.5px; color:var(--gris)}
.dl{display:inline-flex; align-items:center; gap:2px; font:600 11.5px var(--txt); white-space:nowrap}
.dl svg{width:12px; height:12px; fill:none; stroke:currentColor; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round}
.dl.b{color:var(--pos)} .dl.m{color:var(--neg)} .dl.n{color:var(--gris); font-weight:500}
.kpis .dl{align-self:flex-start}
.evo-x{display:grid; margin-top:2px}
.evo-x button,.evo-x span{display:flex; flex-direction:column; align-items:center; padding:5px 0 3px; font-size:11px; color:var(--gris); border-radius:8px; min-height:34px; text-align:center; white-space:nowrap; overflow:hidden}
.evo-x .on{color:var(--tinta); font-weight:700} .evo-x small{font-size:9.5px; font-weight:400; color:var(--gris)}
.meses6 span{display:flex; flex-direction:column; align-items:center; font-size:12px; color:var(--gris); text-align:center} .meses6 span.on{color:var(--tinta); font-weight:700} .meses6 span small{font:500 10.5px var(--num)}
.fv{margin:4px 0 10px} .fv-b{height:8px; border-radius:99px; background:var(--aviso); overflow:hidden} .fv-b i{display:block; height:100%; background:var(--tinta); border-right:2px solid var(--sup)}
.fv .sl-s{margin-top:6px}
.lg-d{margin:3px 0 0 38px}
.rango{margin-bottom:4px} .rango .campo{margin-bottom:8px}
.chips .chip.on .ic{opacity:.8}

/* movimientos: totales de lo filtrado */
.sumf{display:flex; flex-wrap:wrap; gap:4px 14px; margin:2px 4px 8px; font-size:12.5px; color:var(--gris)}
.sumf b{font:600 13px var(--num); color:var(--tinta)} .sumf b.pos{color:var(--pos)}
.filtros .btn.lin{min-height:38px}

/* categorías */
.fila.sub{padding-left:30px; min-height:52px}
.fila.sub .c1{font-weight:500}
.atras{display:inline-flex; align-items:center; gap:2px; font-size:13.5px; font-weight:600; color:var(--marca); padding:6px 0 10px}
.frec{margin-bottom:8px}
.frec .pk{min-height:36px; padding:6px 11px; font-size:13.5px}
.rw.sug select{border-color:var(--pos); box-shadow:0 0 0 3px var(--pos-s)}
.btn svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; margin-right:6px}
.fpr .rw-l b{font-weight:700}
.panel h3:first-of-type{margin-top:14px}

@media (max-width:360px){ #nav button{font-size:9.5px} .kpis>div{padding:0 6px} }
.frec{flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; margin-right:-2px; padding-bottom:2px} .frec::-webkit-scrollbar{display:none}
.frec .pk{flex:none}
.aviso>.ic{color:var(--gris)}
.mesnav b.nt{text-transform:none} .mesnav b.nt::first-letter{text-transform:none}

/* ===================== v6: plan financiero, metas, saldos reales y escritorio ===================== */
.fab-t{display:none}
.cols>.col{min-width:0}
.btn.chico{width:auto; flex:none; min-height:36px; padding:6px 14px; font-size:13.5px; border-radius:10px}
.lnk{color:var(--marca); font-weight:600; font-size:13px; padding:4px 0}
.nota .lnk{font-size:inherit; padding:0; text-decoration:underline}
.dato span small{display:block; font-size:11.5px; color:var(--gris); font-weight:400; margin-top:1px}
.nota.legal{text-align:center; margin:18px 8px 0}
.sec small{font:500 12px var(--txt); color:var(--gris); margin-left:6px}
.ritmo .btn.chico{margin-left:auto}

/* plan: prioridad actual y pasos */
.fase .ph-t{display:flex; align-items:center; gap:12px; margin:8px 0 10px; font:700 19px/1.25 var(--disp); letter-spacing:-.02em}
.fase .ph-p{margin:0; font-size:14px; line-height:1.5; color:var(--gris)} .fase .ph-p b{color:var(--tinta); font-weight:650}
.pasos{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:5px; margin-top:16px}
.pasos span{display:flex; flex-direction:column; gap:6px; min-width:0; font-size:10.5px; color:var(--gris)}
.pasos i{display:block; height:6px; border-radius:99px; background:var(--sup2)}
.pasos .p-ok i{background:var(--pos)} .pasos .p-on i{background:var(--aviso)} .pasos .p-on{color:var(--tinta); font-weight:650}
.pasos em{font-style:normal; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.pm-r{display:flex; align-items:center; gap:12px}
.pm-r>div{min-width:0} .pm-r b{display:block; font-weight:650; font-size:15px} .pm-r span{display:block; font-size:13px; color:var(--gris); margin-top:2px; line-height:1.35}

/* plan: acciones y guía */
.acc{display:flex; align-items:center; gap:12px; width:100%; padding:12px 0; border-top:1px solid var(--linea); text-align:left}
.accs>.acc:first-child,.guia .cab+.acc{border-top:0}
.acc .c{flex:1; min-width:0} .acc .c b{display:block; font-weight:600; font-size:14.5px; line-height:1.3} .acc .c span{display:block; font-size:12.5px; color:var(--gris); margin-top:2px; line-height:1.35}
.acc>strong{flex:none; text-align:right; font:650 15px var(--num); font-variant-numeric:tabular-nums; white-space:nowrap}
.acc>strong small{display:block; font:500 11px var(--txt); color:var(--gris)}
.acc>.ic{color:var(--gris)}
.acc.hoy{background:var(--pos-s); border-radius:14px; padding:12px; border-top:0; margin-bottom:6px}
.acc.hoy+.acc:not(.hoy){border-top:0}
.hoytag{display:block; font-style:normal; font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--pos); margin-bottom:1px}
.guia .pt,.ruta .pt{flex:none; width:30px; height:30px; border-radius:50%; display:grid; place-items:center; background:var(--sup2); color:var(--gris); font:700 13px var(--num)}
.guia .pt svg,.ruta .pt svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round}
.guia .acc:not(.hecho) .pt{background:var(--tc-s); color:var(--tc)}
.guia .hecho .pt{background:var(--pos); color:#fff} .guia .hecho .c b{color:var(--gris); text-decoration:line-through; font-weight:500}

/* plan: reparto del ingreso */
.rep{display:flex; height:14px; border-radius:99px; overflow:hidden; background:var(--sup2); margin:4px 0 10px}
.rep i{display:block; height:100%} .rep i+i{border-left:2px solid var(--sup)}
.rep-l{display:grid; grid-template-columns:minmax(0,1fr) auto 40px; gap:10px; align-items:center; padding:7px 0; border-top:1px solid var(--linea); font-size:13.5px}
.rep+.rep-l{border-top:0}
.rep-l span{display:flex; align-items:center; gap:8px; min-width:0} .rep-l span i{flex:none; width:9px; height:9px; border-radius:3px}
.rep-l b{font:600 14px var(--num); font-variant-numeric:tabular-nums; text-align:right} .rep-l em{font-style:normal; font-size:12px; color:var(--gris); text-align:right}

/* plan: ruta */
.ruta{list-style:none; margin:2px 0 0; padding:0}
.ruta>li{position:relative; display:grid; grid-template-columns:30px minmax(0,1fr); gap:12px; padding-bottom:18px}
.ruta>li:last-child{padding-bottom:0}
.ruta>li::before{content:''; position:absolute; left:14px; top:34px; bottom:4px; width:2px; border-radius:2px; background:var(--linea)}
.ruta>li:last-child::before{display:none}
.ruta>li.r-ok::before{background:var(--pos)}
.ruta>li.r-ok .pt{background:var(--pos); color:#fff} .ruta>li.r-on .pt{background:var(--aviso-s); color:var(--avi-t); box-shadow:0 0 0 2px var(--aviso)}
.ruta>li>div{min-width:0; padding-top:4px}
.ruta>li>div>b{display:block; font-weight:600; font-size:14.5px} .ruta>li.r-ok>div>b{color:var(--gris)}
.ruta>li>div>p{margin:2px 0 0; font-size:12.5px; color:var(--gris); line-height:1.4}
.ruta ul{list-style:none; margin:8px 0 0; padding:0; border-top:1px solid var(--linea)}
.ruta ul li{display:flex; justify-content:space-between; align-items:baseline; gap:10px; padding:6px 0; border-bottom:1px solid var(--linea); font-size:13px}
.ruta ul li span{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap} .ruta ul li b{font:600 13px var(--num); white-space:nowrap}

/* aviso suave para actualizar saldos */
.nudge{display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:16px; background:var(--tc-s); margin-bottom:12px}
.nudge p{flex:1; margin:0; font-size:13.5px; line-height:1.4} .nudge p b{display:block; font-weight:650}

/* metas */
.metas{display:grid; gap:10px; margin-bottom:12px}
.mt{display:block; width:100%; text-align:left; background:var(--sup); border:1px solid var(--linea); border-radius:16px; padding:14px 16px; box-shadow:var(--sombra)}
.mt-t{display:flex; align-items:center; gap:12px} .mt-c{flex:1; min-width:0}
.mt-c b{display:block; font-weight:600; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis} .mt-c small{display:block; font-size:12.5px; color:var(--gris); margin-top:1px}
.mt .pb{margin:12px 0 8px}
.mt.fondo{margin-bottom:12px}
.tps{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; margin-bottom:12px}
.tpm{display:flex; flex-direction:column; align-items:center; gap:5px; padding:10px 2px 9px; border-radius:14px; background:var(--bg); border:1.5px solid var(--linea); font-size:12px; font-weight:600; color:var(--gris); text-align:center; min-width:0}
#vista .tpm{background:var(--sup)}
.tpm svg{width:22px; height:22px; fill:none; stroke:var(--kc); stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round}
.tpm.on{border-color:var(--kc); color:var(--tinta); background:var(--sup2); background:color-mix(in srgb,var(--kc) 12%,var(--sup))}
.plz{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px} .plz .pk{min-height:34px; padding:5px 10px; font-size:13px}
.fme,.fsa,.fpl,.fap{--tk:var(--marca)}
.fsa .rw,.fpl .rw{grid-template-columns:minmax(0,1fr) 140px}
.fsa .rw-l,.fpl .rw-l{font-size:14.5px; flex-wrap:wrap}
.fsa .rw-l small,.fpl .rw-l small{flex-basis:100%; margin:2px 0 0 11px; font-weight:400; color:var(--gris); font-size:11.5px; line-height:1.35}
.fsa .rw-l small.avi{color:var(--avi-t)}
.fsa input,.fpl input{text-align:right}
.sal-d{display:block; min-height:15px; margin-top:3px; font-size:11.5px; text-align:right; color:var(--gris)}
.sal-d.avi{color:var(--avi-t)}
.panel h3 small{font-weight:400; font-size:12px; margin-left:4px}
.vacio-m{text-align:center; padding:8px 4px 4px}
.vacio-m span.bdg{margin:0 auto 10px!important; width:52px!important; height:52px!important; border-radius:16px} .vacio-m span.bdg svg{width:26px; height:26px}
.vacio-m h2{margin:0 0 6px} .vacio-m p{margin:0 auto 16px; color:var(--gris); font-size:14px; max-width:420px}

/* escritorio: barra lateral, contenido en dos columnas y hojas como ventana centrada */
@media (min-width:1024px){
  #app{max-width:none; margin:0; padding-left:248px}
  #top{background:var(--bg); color:var(--tinta); border-bottom:1px solid var(--linea); padding:18px 40px}
  #top h1{font-size:24px}
  #sync{background:var(--sup); color:var(--tinta); border:1px solid var(--linea)}
  #sync.e-local i{background:var(--gris)}
  #vista{width:100%; max-width:1200px; margin:0 auto; padding:24px 40px 56px}
  #vista[data-v=movs]{max-width:900px} #vista[data-v=registrar]{max-width:680px}
  #nav{top:0; bottom:0; right:auto; width:248px; display:flex; flex-direction:column; align-items:stretch; gap:2px; padding:136px 14px 20px; border-top:0; border-right:1px solid var(--linea); background:var(--sup)}
  #nav::before{content:'Finanzas'; position:absolute; top:24px; left:26px; font:700 21px var(--disp); letter-spacing:-.02em; color:var(--tinta)}
  #nav button{flex-direction:row; justify-content:flex-start; gap:12px; min-height:44px; padding:0 12px; border-radius:12px; font-size:14.5px; font-weight:500}
  #nav button:hover{background:var(--sup2); color:var(--tinta)}
  #nav button.on{background:var(--pos-s); color:var(--marca); font-weight:600}
  #nav button svg{width:20px; height:20px}
  #fab{left:14px; right:auto; top:70px; bottom:auto; width:220px; height:46px; border-radius:12px; display:flex; align-items:center; justify-content:center; gap:8px; font-weight:600; font-size:15px; box-shadow:none}
  #fab svg{width:20px; height:20px}
  #fab .fab-t{display:inline}
  #fab:hover{filter:brightness(1.08)}
  body.en-registro #fab{display:flex; opacity:.5; pointer-events:none}
  .cols{display:grid; grid-template-columns:minmax(0,1.45fr) minmax(0,1fr); gap:20px; align-items:start}
  .metas{grid-template-columns:repeat(2,minmax(0,1fr))}
  .seg.tabs{max-width:460px}
  .angosto{max-width:820px}
  .barra{bottom:0}
  .tarj{padding:20px}
  .mesnav{max-width:340px}
  #hoja .panel{top:50%; bottom:auto; left:50%; right:auto; width:min(600px,calc(100vw - 48px)); max-height:86vh; transform:translate(-50%,-50%); border-radius:20px; padding:14px 26px 26px; animation:aparece .18s ease-out}
  .panel .asa{display:none}
  #toast{left:calc(50% + 124px)}
  .fila:hover,.mt:hover,.cat:hover,.acc[data-a]:hover{background:var(--sup2)}
  .mt:hover{border-color:var(--gris)}
}
@keyframes aparece{from{opacity:0; transform:translate(-50%,-48%) scale(.98)}}
</style>
</head>
<body>
<div id="app">
  <header id="top"><h1 id="titulo">Inicio</h1><button id="sync" class="e-local" data-a="conexion" aria-label="Estado de sincronización"><i></i>…</button></header>
  <main id="vista"></main>
  <nav id="nav" aria-label="Pantallas">
    <button data-a="ir" data-v="inicio"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Inicio</button>
    <button data-a="ir" data-v="movs"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>Movimientos</button>
    <button data-a="ir" data-v="plan"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><path d="M12 12l6.5-6.5M16 5.5h2.5V8"/></svg>Plan</button>
    <button data-a="ir" data-v="analisis"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V11M10 20V5M16 20v-6M21 20H3"/></svg>Análisis</button>
    <button data-a="ir" data-v="cuentas"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/></svg>Cuentas</button>
  </nav>
  <button id="fab" data-a="ir" data-v="registrar" aria-label="Registrar movimiento"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="fab-t">Registrar</span></button>
</div>
<div id="hoja" hidden><div class="fondo"></div><section class="panel" role="dialog" aria-modal="true"><div class="asa"></div><div id="hojaC"></div></section></div>
<div id="acceso" hidden><div class="caja fco">
  <h1>Finanzas</h1>
  <p>Conecta la app con tu hoja de Google. La clave se pide una sola vez en este dispositivo.</p>
  <label class="campo"><span>URL del script</span><input name="url" type="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
  <label class="campo"><span>Clave</span><input name="clave" type="password" autocomplete="off"></label>
  <div class="err" hidden></div>
  <div class="btns"><button class="btn" data-a="conectar">Conectar</button><button class="btn lin" data-a="local">Usar sin conexión en este dispositivo</button></div>
  <p class="nota">Sin conexión, los datos se guardan solo en este dispositivo. Puedes conectarla después desde Cuentas y ajustes.</p>
</div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ===================== MOTOR: reglas y cálculos (sin pantalla) ===================== */
var M = (function () {
  'use strict';
  var T = { EF: 'efectivo', DB: 'debito', TC: 'tc', PF: 'prestamo_fijo', PV: 'prestamo_var', TS: 'tc_compartida', PE: 'persona' };
  var CAT_FAVOR = 'Préstamo a favor';
  var HORIZONTE = 12; // meses hacia adelante que se planean
  var S = null, log = [], mapa = new Map(), mapC = new Map(), hoyFijo = null, catMapa = null;

  var NUM = {
    cuentas: ['limite', 'saldoInicial', 'diaCorte', 'pctPropio', 'mensualidad', 'pagosTotales', 'saldoManual'],
    movs: ['monto', 'pctPropio', 'montoPropio', 'mesN', 'mesDe', 'interes', 'mensualidad', 'mesIni', 'montoCorte'],
    fijos: ['monto', 'mes'],
    presupuestos: ['monto']
  };
  var BOOL = {
    cuentas: ['archivada', 'revisar'],
    movs: ['aproximado', 'conInt', 'noAfecta', 'editado', 'incompleto'],
    fijos: ['aproximado', 'activa'],
    presupuestos: ['activa']
  };
  var AJUSTES_DEF = {
    cat_gasto: ['Alimentos', 'Transporte', 'Entretenimiento', 'Salud', 'Vivienda', 'Suscripciones', 'Deudas'],
    cat_ingreso: ['Sueldo', 'Comisión', 'Reembolso'],
    cat_transferencia: ['Pago de tarjeta', 'Pago de préstamo', CAT_FAVOR],
    cat_abono: ['Devolución', 'Cashback y puntos'],
    // subcategorías de gasto: cada entrada es "Padre>Hija". Un movimiento guarda la hija y se suma a su padre.
    cat_sub: [],
    pct_compartido: 50, umbral_uso: 40, ajuste_finde: true, fecha_inicio: '',
    meta_ahorro: 0,   // meta de ahorro mensual (ingresos menos gastos); 0 = sin meta
    version_cat: 0,   // versión de la organización de categorías (para migrar una sola vez)
    // plan financiero: se guardan como texto JSON dentro de ajustes para no necesitar hojas ni columnas nuevas
    plan_cfg: '',     // datos del mes típico, fondo de emergencia, tasas, estrategia y fechas de verificación de saldos
    plan_metas: ''    // metas: casa, auto, boda... con costo, plazo y lo ya ahorrado
  };
  // categorías que usa la propia app para calcular pagos: no se pueden renombrar ni borrar
  var CAT_FIJAS = ['Pago de tarjeta', 'Pago de préstamo', CAT_FAVOR];
  var GEN = '*general'; // fila de presupuestos con el tope general del mes

  /* ---------- utilidades ---------- */
  function r2(n) { return Math.round(((+n) || 0) * 100 + 1e-7 * Math.sign(+n || 0)) / 100; }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parse(s) { var p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function hoy() { return hoyFijo || iso(new Date()); }
  function dim(y, m) { return new Date(y, m + 1, 0).getDate(); }
  function mk(y, m, d) { var b = new Date(y, m, 1); return iso(new Date(b.getFullYear(), b.getMonth(), Math.min(d, dim(b.getFullYear(), b.getMonth())))); }
  function addDays(s, n) { var d = parse(s); d.setDate(d.getDate() + n); return iso(d); }
  function addMonths(s, n, dia) { var d = parse(s); return mk(d.getFullYear(), d.getMonth() + n, dia || d.getDate()); }
  function finMes(s) { var d = parse(s); return mk(d.getFullYear(), d.getMonth(), 31); }
  function iniMes(s) { return s.slice(0, 8) + '01'; }
  function vac(v) { return v === undefined || v === null || v === '' || v === false; }
  function eq(a, b) {
    if (vac(a) && vac(b)) return true;
    if (typeof a === 'number' || typeof b === 'number') return !vac(a) && !vac(b) && Math.abs(+a - +b) < 0.005;
    return a === b;
  }
  function uid(p) { return (p || 'm') + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  /* ---------- estado ---------- */
  function normFila(hoja, f) {
    var o = {};
    for (var k in f) { if (!vac(f[k])) o[k] = f[k]; }
    NUM[hoja].forEach(function (k) { if (k in o) { var n = +o[k]; if (isNaN(n)) delete o[k]; else o[k] = n; } });
    BOOL[hoja].forEach(function (k) { if (k in o) { var v = o[k]; o[k] = v === true || /^(si|sí|true|1|x)$/i.test(String(v)); if (!o[k]) delete o[k]; } });
    ['id', 'diaPago', 'dias', 'ultimos4', 'adicionales', 'fecha', 'corte', 'mesFecha', 'fechaLimite', 'fechaSaldoInicial', 'fechaTermino', 'desde', 'hasta', 'categoria'].forEach(function (k) { if (k in o) o[k] = String(o[k]); });
    return o;
  }
  function norm(d) {
    d = d || {};
    var a = {}, src = d.ajustes || {};
    for (var k in AJUSTES_DEF) a[k] = Array.isArray(AJUSTES_DEF[k]) ? AJUSTES_DEF[k].slice() : AJUSTES_DEF[k];
    for (var k2 in src) {
      if (Array.isArray(AJUSTES_DEF[k2])) a[k2] = (Array.isArray(src[k2]) ? src[k2] : [src[k2]]).map(String).filter(Boolean);
      else if (typeof AJUSTES_DEF[k2] === 'number') a[k2] = isNaN(+src[k2]) ? AJUSTES_DEF[k2] : +src[k2];
      else if (typeof AJUSTES_DEF[k2] === 'boolean') a[k2] = src[k2] === true || /^(si|sí|true|1)$/i.test(String(src[k2]));
      else a[k2] = src[k2];
    }
    CAT_FIJAS.forEach(function (c) { if (a.cat_transferencia.indexOf(c) < 0) a.cat_transferencia.push(c); });
    a.cat_sub = a.cat_sub.filter(function (x) { return /^[^>]+>[^>]+$/.test(x); });
    return {
      cuentas: (d.cuentas || []).filter(function (x) { return x && x.id; }).map(function (x) { return normFila('cuentas', x); }),
      movs: (d.movs || d.movimientos || []).filter(function (x) { return x && x.id; }).map(function (x) { return normFila('movs', x); }),
      fijos: (d.fijos || []).filter(function (x) { return x && x.id; }).map(function (x) { return normFila('fijos', x); }),
      presupuestos: (d.presupuestos || []).filter(function (x) { return x && x.id; }).map(function (x) { return normFila('presupuestos', x); }),
      ajustes: a
    };
  }
  function usar(st) {
    S = st; mapa = new Map(); mapC = new Map(); catMapa = null;
    S.movs.forEach(function (m) { mapa.set(m.id, m); });
    S.cuentas.forEach(function (c) { mapC.set(c.id, c); });
    return S;
  }
  function estado() { return S; }
  function tomarLog() { var l = log; log = []; return l; }
  function logOp(op, hoja, fila) { log.push({ op: op, hoja: hoja, id: fila.id, fila: op === 'upsert' ? JSON.parse(JSON.stringify(fila)) : undefined }); }
  function crea(hoja, o) { o = normFila(hoja, o); S[hoja].push(o); if (hoja === 'movs') mapa.set(o.id, o); if (hoja === 'cuentas') mapC.set(o.id, o); logOp('upsert', hoja, o); return o; }
  function parche(hoja, o, p) {
    var ch = false;
    for (var k in p) { if (!eq(o[k], p[k])) { if (vac(p[k])) delete o[k]; else o[k] = p[k]; ch = true; } }
    if (ch) logOp('upsert', hoja, o);
    return ch;
  }
  function borra(hoja, id) {
    var a = S[hoja], i = a.findIndex(function (x) { return x.id === id; });
    if (i < 0) return;
    a.splice(i, 1); if (hoja === 'movs') mapa.delete(id); if (hoja === 'cuentas') mapC.delete(id);
    logOp('borrar', hoja, { id: id });
  }
  function pone(hoja, o) {
    o = normFila(hoja, o);
    var a = S[hoja], i = a.findIndex(function (x) { return x.id === o.id; });
    if (i >= 0) a[i] = o; else a.push(o);
    if (hoja === 'movs') mapa.set(o.id, o); if (hoja === 'cuentas') mapC.set(o.id, o);
    logOp('upsert', hoja, o); return o;
  }
  function cta(id) { return id ? mapC.get(id) : undefined; }
  function mov(id) { return mapa.get(id); }
  // Si no se ha definido fecha de inicio, el control arranca este mes: evita generar años de
  // movimientos planeados hacia atrás cuando se cargan fijos o cuentas sin fecha.
  function inicio() { return S.ajustes.fecha_inicio || iniMes(hoy()); }

  /* ---------- clasificación ---------- */
  function esActivo(c) { return !!c && (c.tipo === T.EF || c.tipo === T.DB); }
  function esPrestamo(c) { return !!c && (c.tipo === T.PF || c.tipo === T.PV); }
  function esTarjeta(c) { return !!c && (c.tipo === T.TC || c.tipo === T.TS); }
  function pctCta(c) { return c && +c.pctPropio > 0 && +c.pctPropio < 100 ? +c.pctPropio : 100; }
  function pctMov(m) { return +m.pctPropio > 0 && +m.pctPropio < 100 ? +m.pctPropio : 100; }
  function propio(m) { var p = pctMov(m); return p < 100 ? (vac(m.montoPropio) ? r2((+m.monto || 0) * p / 100) : +m.montoPropio) : (+m.monto || 0); }
  function esMens(m) { return !!m.compraId && +m.mesN > 0; }
  function esCompraMeses(m) { return m.tipo === 'gasto' && +m.mesDe > 1 && !(+m.mesN > 0); }
  function vista(m) { return m.estado === 'confirmado' ? 'conf' : m.estado === 'no_realizado' ? 'no' : (m.fecha < hoy() ? 'porconf' : 'pend'); }
  function clasePago(m) {
    if (esMens(m) || m.tipo === 'abono') return null;
    if (m.tipo === 'gasto') return (m.estado !== 'confirmado' || m.plantillaId) && !esCompraMeses(m) ? 'fijo' : null;
    if (m.tipo === 'ingreso') return (m.estado !== 'confirmado' || m.plantillaId) ? 'ingreso' : null;
    var d = cta(m.destino);
    if (!d) return null;
    if (d.tipo === T.TC) return 'tc';
    if (d.tipo === T.TS) return 'tcs';
    if (esPrestamo(d)) return 'prestamo';
    if (d.tipo === T.PE) return 'persona';
    return m.estado !== 'confirmado' ? 'persona' : null;
  }

  /* ---------- efectos sobre saldos ---------- */
  // devuelve {c:[[cuentaId, delta]], p:[[personaId, delta]]}; en pasivos, delta positivo = más deuda
  function efectos(m) {
    var out = { c: [], p: [] };
    if (m.noAfecta || m.estado === 'no_realizado' || esMens(m)) return out;
    var o = cta(m.origen), d = cta(m.destino), monto = +m.monto || 0;
    if (m.tipo === 'ingreso') { if (esActivo(d)) out.c.push([d.id, monto]); }
    else if (m.tipo === 'gasto') {
      if (esActivo(o)) out.c.push([o.id, -monto]);
      else if (o && (o.tipo === T.TC || o.tipo === T.PF)) out.c.push([o.id, monto]);
    } else if (m.tipo === 'abono') { if (d && (d.tipo === T.TC || d.tipo === T.PF)) out.c.push([d.id, -monto]); }
    else if (m.tipo === 'transferencia') {
      var comp = esPrestamo(d) && pctMov(m) < 100;
      var sale = comp && m.quienPaga === 'ella' ? propio(m) : monto;
      if (esActivo(o)) out.c.push([o.id, -sale]);
      else if (o && o.tipo === T.PE) out.p.push([o.id, -monto]);
      else if (o && (o.tipo === T.TC || o.tipo === T.PF)) out.c.push([o.id, sale]);
      if (esActivo(d)) out.c.push([d.id, monto]);
      else if (d && (d.tipo === T.TC || d.tipo === T.PF)) out.c.push([d.id, -monto]);
      else if (d && d.tipo === T.PE && m.categoria === CAT_FAVOR) out.p.push([d.id, monto]);
      if (comp && m.quienPaga !== 'ella' && d.personaId) out.p.push([d.personaId, r2(monto - propio(m))]);
    }
    return out;
  }
  // saldos por cuenta. hasta = fecha tope de planeados (null = solo confirmados)
  function saldos(hasta) {
    var sal = {}, pc = {};
    S.cuentas.forEach(function (c) { sal[c.id] = +c.saldoInicial || 0; if (c.tipo === T.PE && +c.saldoInicial) pc[c.id] = +c.saldoInicial; });
    S.movs.forEach(function (m) {
      if (!(m.estado === 'confirmado' || (hasta && m.estado === 'planeado' && !m.incompleto && m.fecha <= hasta))) return;
      var e = efectos(m);
      e.c.forEach(function (x) { sal[x[0]] = (sal[x[0]] || 0) + x[1]; });
      e.p.forEach(function (x) { pc[x[0]] = (pc[x[0]] || 0) + x[1]; });
    });
    S.cuentas.forEach(function (c) { if (c.tipo === T.PV) sal[c.id] = +c.saldoManual || 0; sal[c.id] = r2(sal[c.id]); });
    for (var k in pc) pc[k] = r2(pc[k]);
    return { sal: sal, pc: pc };
  }
  function posicion(hasta) {
    var s = saldos(hasta), r = { dinero: 0, efectivo: 0, debito: 0, tarjetas: 0, prestamos: 0, cobrar: 0 };
    S.cuentas.forEach(function (c) {
      var v = s.sal[c.id] || 0;
      if (c.tipo === T.EF) r.efectivo += v; else if (c.tipo === T.DB) r.debito += v;
      else if (c.tipo === T.TC) r.tarjetas += v;
      else if (esPrestamo(c)) r.prestamos += v * pctCta(c) / 100;
    });
    for (var k in s.pc) r.cobrar += s.pc[k];
    r.dinero = r.efectivo + r.debito;
    r.total = r.dinero + r.cobrar - r.tarjetas - r.prestamos;
    for (var j in r) r[j] = r2(r[j]);
    r.sal = s.sal; r.pc = s.pc;
    return r;
  }

  /* ---------- categorías y subcategorías ---------- */
  // Las subcategorías viven en ajustes.cat_sub como "Padre>Hija". El movimiento guarda la hija y en
  // presupuestos, gráficas y filtros se suma a su padre: así no hace falta una columna nueva en la hoja.
  var SIN_CAT = 'Sin categoría', A_PERSONAS = 'Entregado a personas', MESES = 'Compras a meses', PRESTAMO = 'Pago de préstamo';
  var GNR = 'Gasto no registrado', AJS = 'Ajuste de saldo'; // los crea la app al actualizar saldos reales
  var RESERVADAS = [SIN_CAT, A_PERSONAS, MESES, GEN, GNR, AJS];
  var LLAVE_TIPO = { cat_gasto: 'gasto', cat_ingreso: 'ingreso', cat_transferencia: 'transferencia', cat_abono: 'abono' };
  function mapaCat() {
    if (catMapa) return catMapa;
    var p = {}, h = {}, tops = {};
    S.ajustes.cat_gasto.forEach(function (c) { tops[c] = 1; });
    (S.ajustes.cat_sub || []).forEach(function (x) {
      var i = x.indexOf('>'), a = x.slice(0, i), b = x.slice(i + 1);
      if (!a || !b || p[b] || tops[b] || a === b) return;
      p[b] = a; (h[a] = h[a] || []).push(b);
    });
    catMapa = { padre: p, hijas: h }; return catMapa;
  }
  function padreCat(c) { return (c && mapaCat().padre[c]) || c || ''; }
  function hijasCat(c) { return (mapaCat().hijas[c] || []).slice(); }
  function esSubcat(c) { return !!(c && mapaCat().padre[c]); }
  function enCat(c, filtro) { return !filtro || c === filtro || padreCat(c) === filtro; }
  function normN(s) { return String(s || '').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
  // ¿el nombre ya existe en alguna lista? (sin distinguir mayúsculas ni acentos)
  function catExiste(n, salvo) {
    var k = normN(n), l = RESERVADAS.slice();
    ['cat_gasto', 'cat_ingreso', 'cat_transferencia', 'cat_abono'].forEach(function (x) { l = l.concat(S.ajustes[x]); });
    l = l.concat(Object.keys(mapaCat().padre));
    return l.some(function (x) { return normN(x) === k && x !== salvo; });
  }
  function tipoDeLlave(key) { return LLAVE_TIPO[key] || 'gasto'; }
  // cuántos registros usan la categoría (incluye sus subcategorías si se pide)
  function usoCat(key, nombre, conHijas) {
    var tipo = tipoDeLlave(key), ns = [nombre].concat(conHijas ? hijasCat(nombre) : []), r = { movs: 0, fijos: 0, pres: 0 };
    S.movs.forEach(function (m) { if (m.tipo === tipo && ns.indexOf(m.categoria) >= 0) r.movs++; });
    S.fijos.forEach(function (f) { if (f.tipo === tipo && ns.indexOf(f.categoria) >= 0) r.fijos++; });
    if (tipo === 'gasto') S.presupuestos.forEach(function (p) { if (ns.indexOf(p.categoria) >= 0) r.pres++; });
    return r;
  }
  // cambia la categoría de movimientos y fijos de ese tipo; no toca importes ni fechas
  function reasignar(tipo, de, a) {
    var n = 0;
    S.movs.forEach(function (m) { if (m.tipo === tipo && de.indexOf(m.categoria) >= 0 && m.categoria !== a) { parche('movs', m, { categoria: a }); n++; } });
    S.fijos.forEach(function (f) { if (f.tipo === tipo && de.indexOf(f.categoria) >= 0 && f.categoria !== a) parche('fijos', f, { categoria: a }); });
    return n;
  }
  function terminaPresupuestos(cats) { // conserva el historial: el tope deja de aplicar desde este mes
    var ym = hoy().slice(0, 7), fin = addMonths(ym + '-01', -1, 1);
    S.presupuestos.slice().forEach(function (p) {
      if (cats.indexOf(p.categoria) < 0) return;
      if (ymDe(p.desde) >= ym) borra('presupuestos', p.id);
      else if (!p.hasta || ymDe(p.hasta) >= ym) parche('presupuestos', p, { hasta: fin });
    });
  }
  function copiaAjustesCat() { var a = {}; ['cat_gasto', 'cat_ingreso', 'cat_transferencia', 'cat_abono', 'cat_sub'].forEach(function (k) { a[k] = S.ajustes[k].slice(); }); return a; }
  function agregarCat(key, nombre, padre) {
    var a = copiaAjustesCat();
    if (padre) a.cat_sub.push(padre + '>' + nombre); else a[key].push(nombre);
    guardarAjustes(a);
  }
  function renombrarCat(key, viejo, nuevo) {
    var a = copiaAjustesCat(), tipo = tipoDeLlave(key), sub = key === 'cat_gasto' && esSubcat(viejo);
    if (sub) a.cat_sub = a.cat_sub.map(function (x) { return x === padreCat(viejo) + '>' + viejo ? padreCat(viejo) + '>' + nuevo : x; });
    else {
      a[key] = a[key].map(function (x) { return x === viejo ? nuevo : x; });
      if (key === 'cat_gasto') a.cat_sub = a.cat_sub.map(function (x) { return x.indexOf(viejo + '>') === 0 ? nuevo + x.slice(viejo.length) : x; });
    }
    var n = reasignar(tipo, [viejo], nuevo);
    if (tipo === 'gasto') S.presupuestos.forEach(function (p) { if (p.categoria === viejo) parche('presupuestos', p, { categoria: nuevo }); });
    guardarAjustes(a); return n;
  }
  // borra la categoría; sus movimientos pasan a "destino" ('' = sin categoría). Si es principal, sus subcategorías también.
  function borrarCat(key, nombre, destino) {
    var a = copiaAjustesCat(), tipo = tipoDeLlave(key), sub = key === 'cat_gasto' && esSubcat(nombre), todas = [nombre];
    if (sub) a.cat_sub = a.cat_sub.filter(function (x) { return x !== padreCat(nombre) + '>' + nombre; });
    else {
      a[key] = a[key].filter(function (x) { return x !== nombre; });
      if (key === 'cat_gasto') { todas = todas.concat(hijasCat(nombre)); a.cat_sub = a.cat_sub.filter(function (x) { return x.indexOf(nombre + '>') !== 0; }); }
    }
    var n = reasignar(tipo, todas, destino || '');
    if (tipo === 'gasto' && !sub) terminaPresupuestos([nombre]);
    guardarAjustes(a); return n;
  }
  // mueve una categoría de gasto: a otra principal (queda como subcategoría) o a principal (padre = '')
  function moverCat(nombre, padre) {
    var a = copiaAjustesCat(), era = padreCat(nombre);
    if (esSubcat(nombre)) a.cat_sub = a.cat_sub.filter(function (x) { return x !== era + '>' + nombre; });
    else { if (hijasCat(nombre).length) return false; a.cat_gasto = a.cat_gasto.filter(function (x) { return x !== nombre; }); terminaPresupuestos([nombre]); }
    if (padre) a.cat_sub.push(padre + '>' + nombre); else a.cat_gasto.push(nombre);
    guardarAjustes(a); return true;
  }
  function ordenarCat(key, nombre, dir) {
    var a = copiaAjustesCat(), l, i, j;
    if (key === 'cat_gasto' && esSubcat(nombre)) {
